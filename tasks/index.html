<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タスク優先管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .task-row { transition: background 0.1s; }
    .task-row:hover { background: #f8fafc; }
    .done-row { opacity: 0.45; }
    .done-row .task-title { text-decoration: line-through; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="../index.html" class="text-gray-400 hover:text-gray-600 text-sm">← ツール一覧</a>
        <span class="text-gray-300">|</span>
        <h1 class="text-lg font-bold text-gray-800">タスク優先管理</h1>
      </div>
      <div class="text-xs text-gray-400" id="task-summary"></div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- タスク追加フォーム -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 mb-5">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-xs font-bold text-yellow-600 bg-yellow-50 px-2 py-0.5 rounded">新規タスク</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
        <!-- タスク名 -->
        <div class="sm:col-span-4">
          <input id="t-title" type="text" placeholder="タスク名 *"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-300"
            onkeydown="if(event.key==='Enter') addTask()" />
        </div>
        <!-- 優先度 -->
        <div class="sm:col-span-2">
          <select id="t-priority" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-300 bg-white">
            <option value="high">🔴 高（急ぎ）</option>
            <option value="mid" selected>🟡 中（今週）</option>
            <option value="low">🟢 低（今月）</option>
          </select>
        </div>
        <!-- カテゴリ -->
        <div class="sm:col-span-2">
          <select id="t-category" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-300 bg-white">
            <option value="sales">営業</option>
            <option value="quote">見積・受注</option>
            <option value="visit">訪問準備</option>
            <option value="admin">事務処理</option>
            <option value="other">その他</option>
          </select>
        </div>
        <!-- 期限 -->
        <div class="sm:col-span-2">
          <input id="t-due" type="date"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-300" />
        </div>
        <!-- 追加ボタン -->
        <div class="sm:col-span-2">
          <button onclick="addTask()"
            class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 rounded-xl transition text-sm flex items-center justify-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            追加
          </button>
        </div>
      </div>
      <!-- メモ（折りたたみ） -->
      <div class="mt-2">
        <input id="t-memo" type="text" placeholder="メモ（省略可）"
          class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-300" />
      </div>
    </div>

    <!-- フィルター＆ソート -->
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <!-- ステータスフィルター -->
      <div class="flex gap-1 bg-white border border-gray-200 rounded-xl p-1">
        <button onclick="setFilter('active')" data-filter="active"
          class="filter-btn active text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-800 text-white transition">未完了</button>
        <button onclick="setFilter('all')" data-filter="all"
          class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg text-gray-600 hover:bg-gray-100 transition">すべて</button>
        <button onclick="setFilter('done')" data-filter="done"
          class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg text-gray-600 hover:bg-gray-100 transition">完了済み</button>
      </div>
      <!-- 優先度フィルター -->
      <button onclick="setPriFilter('all')" data-pri="all"
        class="pri-btn active text-xs px-3 py-1.5 rounded-xl bg-white border-2 border-gray-800 text-gray-800 font-semibold transition">全優先度</button>
      <button onclick="setPriFilter('high')" data-pri="high"
        class="pri-btn text-xs px-3 py-1.5 rounded-xl bg-white border-2 border-gray-200 text-gray-600 font-semibold hover:border-red-400 hover:text-red-600 transition">🔴 高</button>
      <button onclick="setPriFilter('mid')" data-pri="mid"
        class="pri-btn text-xs px-3 py-1.5 rounded-xl bg-white border-2 border-gray-200 text-gray-600 font-semibold hover:border-yellow-400 hover:text-yellow-600 transition">🟡 中</button>
      <button onclick="setPriFilter('low')" data-pri="low"
        class="pri-btn text-xs px-3 py-1.5 rounded-xl bg-white border-2 border-gray-200 text-gray-600 font-semibold hover:border-green-400 hover:text-green-600 transition">🟢 低</button>
      <!-- ソート -->
      <div class="ml-auto flex items-center gap-1">
        <span class="text-xs text-gray-400">並び替え:</span>
        <select id="sort-by" onchange="renderTasks()"
          class="text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-white text-gray-600 focus:outline-none">
          <option value="priority">優先度順</option>
          <option value="due">期限順</option>
          <option value="created">追加順</option>
        </select>
      </div>
    </div>

    <!-- タスクリスト -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <div id="task-list"></div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-sm px-4 py-2.5 rounded-xl opacity-0 transition-opacity pointer-events-none z-50">
    <span id="toast-msg"></span>
  </div>

<script>
const PRI = {
  high: { label:'高（急ぎ）', icon:'🔴', bg:'bg-red-100',    text:'text-red-700',    order:0 },
  mid:  { label:'中（今週）', icon:'🟡', bg:'bg-yellow-100', text:'text-yellow-700', order:1 },
  low:  { label:'低（今月）', icon:'🟢', bg:'bg-green-100',  text:'text-green-700',  order:2 },
};
const CAT = { sales:'営業', quote:'見積・受注', visit:'訪問準備', admin:'事務処理', other:'その他' };

let filterStatus = 'active';
let filterPri    = 'all';

function loadTasks() { return JSON.parse(localStorage.getItem('bt_tasks') || '[]'); }
function saveTasks(t) { localStorage.setItem('bt_tasks', JSON.stringify(t)); }

function addTask() {
  const title = document.getElementById('t-title').value.trim();
  if (!title) { showToast('タスク名を入力してください'); return; }

  const task = {
    id:       Date.now(),
    title,
    priority: document.getElementById('t-priority').value,
    category: document.getElementById('t-category').value,
    due:      document.getElementById('t-due').value,
    memo:     document.getElementById('t-memo').value.trim(),
    done:     false,
    created:  Date.now(),
  };

  const tasks = loadTasks();
  tasks.push(task);
  saveTasks(tasks);
  renderTasks();
  document.getElementById('t-title').value = '';
  document.getElementById('t-memo').value  = '';
  document.getElementById('t-due').value   = '';
  showToast('タスクを追加しました');
}

function toggleDone(id) {
  const tasks = loadTasks().map(t => t.id === id ? {...t, done: !t.done, doneAt: !t.done ? Date.now() : null} : t);
  saveTasks(tasks);
  renderTasks();
}

function deleteTask(id) {
  saveTasks(loadTasks().filter(t => t.id !== id));
  renderTasks();
  showToast('削除しました');
}

function setFilter(f) {
  filterStatus = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    const active = b.dataset.filter === f;
    b.className = active
      ? 'filter-btn active text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-800 text-white transition'
      : 'filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg text-gray-600 hover:bg-gray-100 transition';
  });
  renderTasks();
}

function setPriFilter(p) {
  filterPri = p;
  document.querySelectorAll('.pri-btn').forEach(b => {
    const active = b.dataset.pri === p;
    b.className = active
      ? 'pri-btn active text-xs px-3 py-1.5 rounded-xl bg-white border-2 border-gray-800 text-gray-800 font-semibold transition'
      : 'pri-btn text-xs px-3 py-1.5 rounded-xl bg-white border-2 border-gray-200 text-gray-600 font-semibold hover:border-gray-400 transition';
  });
  renderTasks();
}

function renderTasks() {
  let tasks = loadTasks();

  // フィルター
  if (filterStatus === 'active') tasks = tasks.filter(t => !t.done);
  if (filterStatus === 'done')   tasks = tasks.filter(t =>  t.done);
  if (filterPri !== 'all')       tasks = tasks.filter(t => t.priority === filterPri);

  // ソート
  const sort = document.getElementById('sort-by').value;
  tasks.sort((a, b) => {
    if (sort === 'priority') {
      const pd = PRI[a.priority].order - PRI[b.priority].order;
      if (pd !== 0) return pd;
      // 同優先度なら期限が近い順
      if (a.due && b.due) return a.due.localeCompare(b.due);
      if (a.due) return -1;
      if (b.due) return 1;
      return b.created - a.created;
    }
    if (sort === 'due') {
      if (a.due && b.due) return a.due.localeCompare(b.due);
      if (a.due) return -1;
      if (b.due) return 1;
      return PRI[a.priority].order - PRI[b.priority].order;
    }
    return b.created - a.created;
  });

  // サマリー更新
  const all    = loadTasks();
  const active = all.filter(t => !t.done).length;
  const high   = all.filter(t => !t.done && t.priority === 'high').length;
  document.getElementById('task-summary').textContent =
    `未完了: ${active}件${high > 0 ? ` ／ 🔴 急ぎ: ${high}件` : ''}`;

  const el = document.getElementById('task-list');
  if (tasks.length === 0) {
    el.innerHTML = '<p class="text-sm text-gray-400 text-center py-10">タスクはありません</p>';
    return;
  }

  const today = new Date().toISOString().slice(0,10);
  el.innerHTML = tasks.map((t, i) => {
    const p = PRI[t.priority];
    const dueClass = t.due && t.due < today && !t.done ? 'text-red-500 font-bold' : 'text-gray-500';
    const dueLabel = t.due
      ? (() => {
          const diff = Math.round((new Date(t.due) - new Date(today)) / 86400000);
          if (diff < 0)  return `<span class="text-red-500 font-bold">⚠ ${Math.abs(diff)}日超過</span>`;
          if (diff === 0) return `<span class="text-red-500 font-bold">今日まで</span>`;
          if (diff === 1) return `<span class="text-orange-500">明日まで</span>`;
          if (diff <= 3)  return `<span class="text-orange-400">${diff}日後</span>`;
          return `<span class="text-gray-400">${t.due.slice(5).replace('-','/')}</span>`;
        })()
      : '';

    return `
    <div class="task-row ${t.done ? 'done-row' : ''} flex items-center gap-3 px-4 py-3 border-b border-gray-100 last:border-0 fade-in">
      <!-- チェックボックス -->
      <button onclick="toggleDone(${t.id})"
        class="flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition
          ${t.done ? 'bg-gray-400 border-gray-400' : 'border-gray-300 hover:border-yellow-400'}">
        ${t.done ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
      </button>

      <!-- 優先度バッジ -->
      <span class="flex-shrink-0 text-xs font-bold px-2 py-0.5 rounded-full ${p.bg} ${p.text}">${p.icon}</span>

      <!-- タスク内容 -->
      <div class="flex-1 min-w-0">
        <p class="task-title text-sm font-semibold text-gray-800 truncate">${escHtml(t.title)}</p>
        <div class="flex items-center gap-2 mt-0.5 flex-wrap">
          <span class="text-xs text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">${CAT[t.category] || 'その他'}</span>
          ${dueLabel ? `<span class="text-xs">${dueLabel}</span>` : ''}
          ${t.memo ? `<span class="text-xs text-gray-400 truncate max-w-32">${escHtml(t.memo)}</span>` : ''}
        </div>
      </div>

      <!-- 削除 -->
      <button onclick="deleteTask(${t.id})" class="flex-shrink-0 text-gray-300 hover:text-red-400 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2000);
}

renderTasks();
</script>
</body>
</html>
