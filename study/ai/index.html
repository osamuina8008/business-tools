<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="AI横断">
<title>AI五者横断ノート</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F1F3F6; --surface:#FFFFFF; --sunk:#E7EBF0;
  --ink:#15202B; --muted:#5D6B7A; --line:#D3DAE2;
  --ai:#1F4E79; --agree:#2E7355; --differ:#AE3826; --flagbg:#FBECE8;
  --disp:"Zen Old Mincho",serif; --body:"Zen Kaku Gothic New",system-ui,sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161B; --surface:#1B212A; --sunk:#232A34;
  --ink:#E3E8EE; --muted:#94A2B2; --line:#2E3742;
  --ai:#83B4E4; --agree:#66C79B; --differ:#EC8272; --flagbg:#3A2420;
}}
:root[data-theme="dark"]{
  --paper:#12161B; --surface:#1B212A; --sunk:#232A34;
  --ink:#E3E8EE; --muted:#94A2B2; --line:#2E3742;
  --ai:#83B4E4; --agree:#66C79B; --differ:#EC8272; --flagbg:#3A2420;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.85;-webkit-text-size-adjust:100%}
.wrap{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}

/* ---- 左レール ---- */
aside{background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0 40px}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand h1{font-family:var(--disp);font-size:19px;margin:0;letter-spacing:.04em;text-wrap:balance}
.brand p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.navbar{display:flex;align-items:center;gap:8px;padding:10px 18px;
  border-bottom:1px solid var(--line)}
.navbar .lbl{flex:1;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.sortbtn{flex:none;background:var(--sunk);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.sortbtn:hover{border-color:var(--ai);color:var(--ai)}
.duetop{margin:10px 12px;padding:9px 11px;border-radius:8px;background:var(--flagbg);
  border:1px solid var(--differ);font-size:11.5px;line-height:1.7}
.duetop b{display:block;color:var(--differ);font-size:11px;letter-spacing:.1em;margin-bottom:2px}
.duetop span{display:block;color:var(--ink)}
.grp{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  padding:12px 14px 12px 12px;margin-top:6px;background:none;border:0;border-top:1px solid var(--line);
  font:inherit;font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700;cursor:pointer}
.grp:hover{background:var(--sunk);color:var(--ink)}
.grp .cv{flex:none;display:inline-block;transition:transform .15s;font-size:10px;opacity:.7}
.grp.open .cv{transform:rotate(90deg)}
.grp .gt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp.due .gt{color:var(--differ)}
.grp .badge{flex:none;background:var(--differ);color:#fff;border-radius:4px;
  padding:1px 5px;font-size:9.5px;letter-spacing:.02em}
.grp .fl{flex:none;color:var(--differ);font-size:10px}
.grp .ct{flex:none;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums;opacity:.8}
.qbtn{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;
  border:0;border-left:3px solid transparent;padding:7px 18px;color:var(--ink);
  font:inherit;font-size:13.5px;cursor:pointer;line-height:1.5}
.qbtn:hover{background:var(--sunk)}
.qbtn.on{border-left-color:var(--ai);background:var(--sunk);font-weight:700}
.qbtn b{font-family:var(--disp);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.qbtn span{color:var(--muted);font-size:12px;overflow:hidden;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qbtn.on span{color:var(--ink)}
.qbtn em{flex:none;font-style:normal;color:var(--differ);font-weight:700}
.qbtn:focus-visible,button:focus-visible{outline:2px solid var(--ai);outline-offset:-2px}
#navtoggle{display:none;flex:none;background:var(--sunk);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}

/* ---- 本体 ---- */
main{padding:28px 30px 80px;max-width:1400px}
.qhead{margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.qhead h2{font-family:var(--disp);font-size:30px;margin:2px 0 4px;letter-spacing:.03em}
.qhead p{margin:0;color:var(--muted);font-size:14px;max-width:65ch}

h3.sec{font-family:var(--disp);font-size:15px;letter-spacing:.06em;margin:34px 0 12px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;min-width:560px;width:100%;background:var(--surface);
  border:1px solid var(--line)}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top;font-size:13.5px;line-height:1.7}
thead th{background:var(--sunk);font-family:var(--disp);font-size:13px;white-space:nowrap;letter-spacing:.04em}
tbody th{background:var(--sunk);white-space:nowrap;font-weight:700;font-size:12.5px;color:var(--muted)}
td.mid{text-align:center;font-variant-numeric:tabular-nums}
td.ans{font-weight:700;font-variant-numeric:tabular-nums}
tr.split th{color:var(--differ)}
tr.split td{background:var(--flagbg)}
.tok{display:block}
.tok.all{font-weight:700}
.tok.solo{color:var(--differ)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.mk{display:inline-block;min-width:1.6em;text-align:center;font-weight:700;border-radius:2px;padding:0 .2em}
.mk.m-a{color:#fff;background:var(--agree)}
.mk.m-b{color:var(--agree);border:1px solid var(--agree)}
.mk.m-c{color:var(--ink);border:1px solid var(--muted)}
.mk.m-d{color:#fff;background:var(--differ)}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;position:sticky;top:0;z-index:3;
  background:var(--paper);padding:9px 0;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:2px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:700}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.col{background:var(--surface);border:1px solid var(--line);padding:0 16px 14px;
  max-height:74vh;overflow:auto;border-radius:3px}
.col h4{margin:0 0 10px;font-family:var(--disp);font-size:13px;letter-spacing:.06em;
  color:var(--ai);border-bottom:1px solid var(--line);padding:11px 0 7px;
  position:sticky;top:0;background:var(--surface);z-index:1}
/* ---- 本文（マークダウンを組んだもの）---- */
.md{font-size:14px;line-height:1.95;word-break:break-word}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .9em}
.md h5{font-family:var(--disp);font-size:14.5px;margin:1.5em 0 .5em;color:var(--ai);
  letter-spacing:.04em;padding-bottom:3px;border-bottom:1px solid var(--line)}
.md h6{font-size:13px;font-weight:700;margin:1.25em 0 .4em}
.md ul,.md ol{margin:.35em 0 .95em;padding-left:1.45em}
.md ul ul,.md ol ol,.md ul ol,.md ol ul{margin:.25em 0 .35em}
.md li{margin:.3em 0;padding-left:.1em}
.md li::marker{color:var(--muted)}
.md strong{font-weight:700}
.md em{font-style:normal;color:var(--ai);font-weight:500}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;
  background:var(--sunk);padding:.1em .38em;border-radius:3px}
.md pre{background:var(--sunk);padding:10px 12px;border-radius:4px;overflow-x:auto;margin:.7em 0}
.md pre code{background:none;padding:0;font-size:.86em;line-height:1.7}
.md blockquote{margin:.7em 0;padding:.15em 0 .15em .9em;border-left:2px solid var(--line);color:var(--muted)}
.md table{min-width:0;margin:.7em 0;font-size:12.5px}
.md hr{border:0;border-top:1px solid var(--line);margin:1.1em 0}
.md a{color:var(--ai)}

/* ---- 自分の条文ノートの引用 ---- */
.kw.mine{cursor:pointer;border-style:solid;border-bottom-width:2px;font:inherit;font-size:11.5px}
.kw.mine::after{content:" ✎";opacity:.6}
.art{margin:12px 0 0;padding:12px 15px;background:var(--surface);border:1px solid var(--ai);
  border-left-width:3px;border-radius:3px;display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.art b{font-family:var(--disp);font-size:14px;color:var(--ai);white-space:nowrap}
.art span{font-size:13px;line-height:1.8;flex:1;min-width:200px}
.art span.none{color:var(--muted)}
.art a{font-size:12px;white-space:nowrap;color:var(--ai)}

/* ---- 過去につまずいた記録 ---- */
.past{margin-top:8px;padding:11px 15px;border:1px solid var(--line);border-radius:3px;
  background:var(--surface)}
.past.q{border-left:3px solid var(--differ)}
.past.m{border-left:3px solid var(--muted)}
.past>b{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:6px}
.past.q>b{color:var(--differ)}
.past.m>b{color:var(--muted)}
.past ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.past li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:12.5px;line-height:1.6}
.past .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px;white-space:nowrap}
.past a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.past a:hover{border-bottom-color:var(--ai);color:var(--ai)}

/* ---- 判定の見方 ---- */
.howto{margin-top:9px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.howto summary{cursor:pointer;padding:9px 13px;font-size:12.5px;color:var(--ai);font-weight:700;
  list-style:none;min-height:38px;display:flex;align-items:center}
.howto summary::before{content:"▸ ";margin-right:4px}
.howto[open] summary::before{content:"▾ "}
.howto summary::-webkit-details-marker{display:none}
.howto>:not(summary){margin:0 13px 11px;font-size:12.5px;line-height:1.8;color:var(--muted)}
.howto b{color:var(--ink)}
.howtab{min-width:0;margin:0 13px 11px;width:calc(100% - 26px)}
.howtab th{white-space:nowrap;width:1%;text-align:left}
.howtab td{font-size:12.5px;color:var(--muted)}
.howto .warn{border-left:2px solid var(--differ);padding-left:10px}
.howto .sub{font-size:12px}

/* ---- 疑問メモ欄 ---- */
.ask{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:14px 16px;margin:18px 0 6px}
.ask label{display:block;font-family:var(--disp);font-size:13px;letter-spacing:.06em;
  color:var(--ai);margin-bottom:7px}
.ask textarea{width:100%;font:inherit;font-size:14px;line-height:1.7;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:9px 11px;
  resize:vertical;min-height:70px}
.ask textarea:focus{outline:2px solid var(--ai);outline-offset:-1px}
.askbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.askbtns button{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:3px;padding:9px 16px;font:inherit;font-size:13.5px;cursor:pointer;min-height:40px}
.askbtns button:hover{background:var(--sunk)}
.askbtns .primary{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:700}
.ask .hint{margin:9px 0 0;font-size:11.5px;color:var(--muted);line-height:1.7}
.col h4{display:flex;align-items:center;gap:8px}
.kws{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;padding-bottom:11px;
  border-bottom:1px dashed var(--line)}
.kw{font-size:11.5px;line-height:1.5;padding:2px 9px;border-radius:2px;
  border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.kw.all{border-color:var(--agree);color:var(--agree);font-weight:700}
.kw.solo{border-color:var(--differ);color:var(--differ);background:var(--flagbg)}
.col .send{margin-left:auto;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:3px;font:inherit;font-size:13px;line-height:1;padding:5px 9px;cursor:pointer;min-height:30px}
.col .send:hover{background:var(--ai);border-color:var(--ai);color:#fff}
#flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:4px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;max-width:88vw;text-align:center}
#flash.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- iPad・iPhone ---- */
@media(max-width:1024px){
  .tabs button{padding:9px 14px;font-size:13.5px;min-height:40px}
  .col{max-height:none}
}
@media(max-width:820px){
  /* 1fr のままだと中の表(min-width:560px)が列幅を押し広げて横スクロールになる */
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside,main{min-width:0}
  aside{position:sticky;top:0;z-index:15;height:auto;max-height:none;border-right:0;
    border-bottom:1px solid var(--line);padding:12px 0 0}
  .brand{display:flex;align-items:center;gap:10px;padding:0 16px 10px;margin-bottom:0}
  .brand h1{font-size:16px;flex:1;min-width:0}
  .brand p{display:none}
  #navtoggle{display:block}
  #nav{display:none;max-height:58vh;overflow-y:auto;padding-bottom:10px}
  body.navopen #nav{display:block}
  main{padding:20px 16px 60px}
  .qhead h2{font-size:24px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="wrap">
<aside>
  <div class="brand">
    <h1>AI五者横断ノート</h1>
    <p>ChatGPT・Claude・Gemini・Grok・Copilot の解説を、問題番号ごとに突き合わせる</p>
    <button id="navtoggle" aria-expanded="false">問題一覧</button>
  </div>
  <nav id="nav"></nav>
</aside>
<main id="main"></main>
<div id="flash"></div>
</div>
<script>
/* データは2系統。
   ・埋め込み版（Obsidian/GoodNotes向け）＝ EMBED に全部入っている。従来どおり。
   ・web配信版（GitHub Pages・iPad向け）＝ EMBED は null。まず manifest だけ読み、
     開いた日の本体だけ data/{日付科目}.json から取りに行く。 */
const EMBED = null;
const WEB   = "data/";
let DB = {days:[], arts:{}};
const LOADED = new Set();
const ORDER = ["ChatGPT","Claude Sonnet","Gemini","Grok","Copilot","NotebookLM","その他"];
const SECORD = "①②③④⑤⑥⑦⑧⑨";
const nav = document.getElementById('nav'), main = document.getElementById('main');
let flat = [];
function buildFlat(){
  flat = [];
  DB.days.forEach(d => d.qs.forEach(q => flat.push({...q, day:d.day, subject:d.subject})));
}

const na = s => (s.match(/\d/g)||[]).sort().join('');
const ais = q => ORDER.filter(a => q.ai[a]);
const split = q => new Set(ais(q).map(a=>q.ai[a].answer).filter(Boolean).map(na)).size > 1;
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---- マークダウンを HTML に組む（**強調**・箇条書き・見出し・表・コード）---- */
function inline(t){
  let h = esc(t);
  const code = [];
  h = h.replace(/`([^`]+)`/g, (m,c)=>{ code.push(c); return '\uE000'+(code.length-1)+'\uE001'; });
  h = h.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
       .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
       .replace(/~~([^~]+)~~/g, '<s>$1</s>')
       .replace(/\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return h.replace(/\uE000(\d+)\uE001/g, (m,i)=>'<code>'+code[+i]+'</code>');
}
function md(src){
  if(!src) return '';
  const L = String(src).replace(/\r\n?/g,'\n').split('\n');
  const out = []; let i = 0, para = [];
  const flush = () => { if(para.length){ out.push('<p>'+inline(para.join('\n')).replace(/\n/g,'<br>')+'</p>'); para = []; } };
  const depth = sp => Math.min(Math.floor(sp.replace(/\t/g,'  ').length/2), 1);
  const LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

  while(i < L.length){
    const ln = L[i];

    if(/^\s*```/.test(ln)){
      flush(); const buf = []; i++;
      while(i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]);
      i++; out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue;
    }
    if(/^\s*(-{3,}|_{3,}|\*{3,})\s*$/.test(ln)){ flush(); out.push('<hr>'); i++; continue; }

    let m = ln.match(/^\s*(#{1,6})\s+(.*)$/);
    if(m){ flush(); const t = m[1].length <= 3 ? 5 : 6;
      out.push('<h'+t+'>'+inline(m[2])+'</h'+t+'>'); i++; continue; }

    if(/^\s*\|.*\|\s*$/.test(ln)){
      flush(); const rows = [];
      while(i < L.length && /^\s*\|.*\|\s*$/.test(L[i])){
        rows.push(L[i].trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim())); i++;
      }
      const sep = rows[1] && rows[1].every(c=>/^:?-{2,}:?$/.test(c));
      const head = sep ? rows[0] : null, body = sep ? rows.slice(2) : rows;
      out.push('<div class="scroll"><table>'
        + (head ? '<thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead>' : '')
        + '<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')
        + '</tbody></table></div>');
      continue;
    }

    m = ln.match(LI);
    if(m){
      flush();
      const stack = [];
      const open = t => { out.push('<'+t+'>'); stack.push(t); };
      open(/\d/.test(m[2]) ? 'ol' : 'ul');
      let d0 = depth(m[1]);
      while(i < L.length){
        const mm = L[i].match(LI);
        if(!mm){
          if(/^\s+\S/.test(L[i]) && out.length && /<\/li>$/.test(out[out.length-1])){
            out[out.length-1] = out[out.length-1].replace(/<\/li>$/, '<br>'+inline(L[i].trim())+'</li>');
            i++; continue;
          }
          break;
        }
        const d = depth(mm[1]);
        if(d > d0){ open(/\d/.test(mm[2]) ? 'ol' : 'ul'); d0 = d; }
        while(d < d0 && stack.length > 1){ out.push('</'+stack.pop()+'>'); d0--; }
        out.push('<li>'+inline(mm[3])+'</li>');
        i++;
      }
      while(stack.length) out.push('</'+stack.pop()+'>');
      continue;
    }

    if(/^\s*>\s?/.test(ln)){
      flush(); const buf = [];
      while(i < L.length && /^\s*>\s?/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>'); continue;
    }

    if(!ln.trim()){ flush(); i++; continue; }
    para.push(ln); i++;
  }
  flush();
  return out.join('');
}

/* 一覧の ⚑ は、本体を読む前でも出せるように manifest 側で計算済み（sp）。 */
const flagged = q => (q.sp !== undefined ? q.sp : split(q));
/* ── 目次の状態（並び順・日ごとの開閉）は端末に憶えておく ── */
const NAVKEY = 'qg_nav';
let navState = (() => { try { return JSON.parse(localStorage.getItem(NAVKEY) || '{}'); }
  catch(e){ return {}; } })();
if (typeof navState.desc !== 'boolean') navState.desc = true;   /* 既定＝新しい順 */
function saveNav(){ try { localStorage.setItem(NAVKEY, JSON.stringify(navState)); } catch(e){} }

/* ── 復習どき：3日前・1週間前・21日前にあたる日に印を出す ── */
const CHECKPOINTS = [{n:3, l:'3日前'}, {n:7, l:'1週間前'}, {n:21, l:'21日前'}];
const ymd = s => String(s).slice(0, 10);
function daysAgo(day){
  const m = ymd(day).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  const then = new Date(+m[1], +m[2]-1, +m[3]); then.setHours(0,0,0,0);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now - then) / 86400000);
}
function dueOf(day){
  const n = daysAgo(day);
  if (n === null) return null;
  const hit = CHECKPOINTS.find(c => c.n === n);
  return hit ? hit.l : null;
}

function newestDay(){
  let p = null;
  DB.days.forEach(d => { if (d.qs.length && (!p || d.day > p)) p = d.day; });
  return p;
}
function isOpen(day){
  if (navState.open && day in navState.open) return !!navState.open[day];
  return day === newestDay();          /* 既定はいちばん新しい日だけ開く */
}
function setOpen(day, v){
  navState.open = navState.open || {};
  navState.open[day] = v; saveNav();
}
function markActive(){
  const uid = CUR ? CUR.day + CUR.id : null;
  [...nav.querySelectorAll('.qbtn')].forEach(b => b.classList.toggle('on', b.dataset.id === uid));
}

function buildNav(){
  nav.innerHTML = '';
  const days = DB.days.slice().filter(d => d.qs.length)
    .sort((a, b) => navState.desc ? (a.day < b.day ? 1 : -1) : (a.day > b.day ? 1 : -1));

  const bar = document.createElement('div');
  bar.className = 'navbar';
  bar.innerHTML = `<span class="lbl">${days.length}日</span>`;
  const sb = document.createElement('button');
  sb.className = 'sortbtn';
  sb.textContent = navState.desc ? '新しい順 ↓' : '古い順 ↑';
  sb.title = '並び順を入れ替える';
  sb.onclick = () => { navState.desc = !navState.desc; saveNav(); buildNav(); markActive(); };
  bar.appendChild(sb);
  nav.appendChild(bar);

  const due = days.filter(d => dueOf(d.day));
  if (due.length){
    const t = document.createElement('div');
    t.className = 'duetop';
    t.innerHTML = '<b>きょう復習する日</b>' + due.map(d =>
      `<span>${esc(d.subject)}　${ymd(d.day).slice(5).replace('-','/')}（${dueOf(d.day)}）</span>`).join('');
    nav.appendChild(t);
  }

  days.forEach(d => {
    const open = isOpen(d.day), label = dueOf(d.day);
    const flags = d.qs.filter(flagged).length;
    const h = document.createElement('button');
    h.className = 'grp' + (open ? ' open' : '') + (label ? ' due' : '');
    h.setAttribute('aria-expanded', open ? 'true' : 'false');
    h.innerHTML = '<span class="cv">▸</span>'
      + `<span class="gt">${esc(d.subject)}　${ymd(d.day)}</span>`
      + (label ? `<span class="badge">${label}</span>` : '')
      + (flags ? `<span class="fl">⚑${flags}</span>` : '')
      + `<span class="ct">${d.qs.length}</span>`;
    h.onclick = () => { setOpen(d.day, !isOpen(d.day)); buildNav(); markActive(); };
    nav.appendChild(h);
    if (!open) return;
    d.qs.forEach(q => {
      const b = document.createElement('button');
      b.className = 'qbtn'; b.dataset.id = d.day + q.id;
      b.innerHTML = `<b>${q.id}</b><span>${esc(q.title||'—')}</span>` + (flagged(q)?'<em>⚑</em>':'');
      b.onclick = () => show(d.day + q.id);
      nav.appendChild(b);
    });
  });
}

function verdicts(q){
  const A = ais(q), rv = q.review || {};
  let h = '<div class="scroll"><table><thead><tr><th>AI</th><th>判定</th><th>分量</th><th>中身</th></tr></thead><tbody>';
  A.forEach(a => { const r = rv[a]; if(!r) return;
    h += `<tr><th>${a}</th><td class="mid"><span class="mk ${MARKCLS[r.mark]||''}">${r.mark}</span> ${esc(r.verdict)}</td>`
      +  `<td class="mid">${r.secs}節 / ${r.chars.toLocaleString()}字</td><td>${esc(r.note)}</td></tr>`;
  });
  h += '</tbody></table></div>' + HOWTO;
  return h;
}

function matrix(q){
  const A = ais(q);
  const count = (x, f) => A.filter(a => q.ai[a][f].includes(x)).length;
  const cell = (a, f) => {
    const u = [...new Set(q.ai[a][f])];
    if (!u.length) return '<span style="color:var(--muted)">—</span>';
    return u.map(x => {
      const n = count(x, f);
      const cls = n === A.length ? 'all' : (n === 1 ? 'solo' : '');
      return `<span class="tok ${cls}">${esc(x)}${n===1?' ⚑':''}</span>`;
    }).join('');
  };
  let h = `<div class="scroll"><table><thead><tr><th></th>${A.map(a=>`<th>${a}</th>`).join('')}</tr></thead><tbody>`;
  const sp = split(q);
  h += `<tr class="${sp?'split':''}"><th>正解</th>${A.map(a=>`<td class="ans mid">${esc(q.ai[a].answer||'—')}</td>`).join('')}</tr>`;
  const labels = [...new Set(A.flatMap(a=>Object.keys(q.ai[a].choices)))].sort();
  labels.forEach(lb => {
    const vs = new Set(A.map(a=>q.ai[a].choices[lb]).filter(Boolean));
    const bad = vs.size > 1;
    h += `<tr class="${bad?'split':''}"><th>肢 ${lb}${bad?' ⚑':''}</th>${A.map(a=>`<td class="mid">${q.ai[a].choices[lb]||'—'}</td>`).join('')}</tr>`;
  });
  h += `<tr><th>挙げた条文</th>${A.map(a=>`<td>${cell(a,'articles')}</td>`).join('')}</tr>`;
  h += `<tr><th>挙げた判例</th>${A.map(a=>`<td>${cell(a,'cases')}</td>`).join('')}</tr>`;
  h += '</tbody></table></div><p class="legend">太字＝全AIが挙げた／<span style="color:var(--differ)">朱色 ⚑</span>＝1つのAIだけが挙げた・判断が割れた箇所</p>';
  return h;
}

const RFQ = 'rf_queue';
const rfKey = q => q.day + '|' + q.id;
function rfLoad(){ try { return JSON.parse(localStorage.getItem(RFQ) || '{}'); } catch(e){ return {}; } }
function rfSave(v){ try { localStorage.setItem(RFQ, JSON.stringify(v)); return true; } catch(e){ return false; } }

function rfToggle(q){

function ctx(q, withBody){

  let t = '予備試験の問題 ' + q.id + '（' + q.subject + '／' + q.day.slice(0,10) + '）について。\n'

async function toClip(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const a = document.createElement('textarea');
    a.value = t; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    a.remove(); return ok;
  }
}
function flash(msg){
  const el = document.getElementById('flash');
  if (!el) return;
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 2600);
}
async function toGPT(text){
  if (text.length <= 1200) {
    window.open('https://chatgpt.com/?q=' + encodeURIComponent(text), '_blank', 'noopener');
  } else {
    const ok = await toClip(text);
    flash(ok ? '長いのでコピーしました。ChatGPT で貼り付けてください。' : 'コピーできませんでした。');
    window.open('https://chatgpt.com/', '_blank', 'noopener');

/* ---- 節の本文から要点の語を拾う ---- */
const LAWRE = /(?:民法|商法|会社法|手形法|小切手法|刑法|刑事訴訟法|刑訴法|民事訴訟法|民訴法|憲法|行政法|破産法)?第?\d{1,4}条(?:の\d{1,2})?(?:[ⅠⅡⅢⅣⅤ]|第?\d項)?/g;
function kws(t, ai){
  const out = [];
  const push = x => {
    x = String(x||'').trim().replace(/^[「『（(\[]+|[」』）)\]]+$/g,'').replace(/[、。：:]$/,'');
    if(x.length>=2 && x.length<=16 && !/[。！？\n]/.test(x) && !out.includes(x)) out.push(x);
  };
  (ai.articles||[]).slice(0,4).forEach(push);      // 挙げた条文
  (ai.cases||[]).slice(0,3).forEach(push);         // 挙げた判例
  if(t){                                           // 本文の太字のうち、語として短いもの
    (t.match(/\*\*([^*\n]{2,16})\*\*/g)||[]).forEach(m => push(m.replace(/\*\*/g,'')));
    (t.match(LAWRE)||[]).forEach(push);
  }
  return out.slice(0,7);
}

    .map(a => {

function ingest(data, full){
  (data.days || []).forEach(d => {
    const ex = DB.days.find(x => x.day === d.day);
    if (ex) ex.qs = d.qs; else DB.days.push(d);
    if (full) LOADED.add(d.day);
  });
  Object.assign(ARTS, data.arts || {});
  Object.assign(PAST, data.past || {});
  buildFlat();
}

/* #2026-09-12刑訴法/Q258 でも #Q258 でも開ける（復習フィードから飛ばすため）。 */
function fromHash(){
  const h = decodeURIComponent(String(location.hash || '').replace(/^#/, '')).trim();
  if (!h) return null;
  const [a, b] = h.split('/');
  const last = arr => arr.length ? arr[arr.length - 1].day + arr[arr.length - 1].id : null;
  if (b) {
    const q = flat.find(x => x.day === a && x.id === b);
    if (q) return q.day + q.id;
    /* Q番号は科目ごとの通し番号なので、科目名で絞れる形も受ける（例 #商法/Q258）。 */
    const bySubj = last(flat.filter(x => x.subject === a && x.id === b));
    if (bySubj) return bySubj;
  }
  return last(flat.filter(x => x.id === a));   /* 番号だけなら直近の日のもの */
}

function firstOfNewestDay(){
  let pick = null;
  DB.days.forEach(d => { if (d.qs.length && (!pick || d.day > pick.day)) pick = d; });
  return pick ? pick.day + pick.qs[0].id : (flat.length ? flat[0].day + flat[0].id : null);
}

async function boot(){
  if (EMBED) {
    ingest(EMBED, true);
  } else {
    try {
      const r = await fetch(WEB + 'manifest.json', {cache:'no-cache'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      ingest(await r.json(), false);
    } catch(e){
      main.innerHTML = '<div class="qhead"><h2>目次を読み込めませんでした</h2><p>'
        + esc(String(e && e.message || e)) + '</p></div>';
      return;
    }
  }
  buildNav();
  if (!flat.length) { main.innerHTML = '<div class="qhead"><h2>データがありません</h2></div>'; return; }
  show(fromHash() || firstOfNewestDay());
}

window.addEventListener('hashchange', () => { const u = fromHash(); if (u) show(u); });
boot();
</script>
