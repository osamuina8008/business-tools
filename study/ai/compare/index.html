<script>
let DATA, JOB=0, Q='Q62', MODE='study';
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function formatted(tag,text){const p=el(tag);text.split(/(\*\*[^*]+\*\*)/g).forEach(t=>p.append(t.startsWith('**')&&t.endsWith('**')?el('strong',t.slice(2,-2)):document.createTextNode(t)));return p}
function markdown(text){const box=el('div',undefined,'markdown');let code=false,buf=[];const flush=()=>{if(buf.length){box.append(code?el('pre',buf.join('\n')):formatted('p',buf.join('\n')));buf=[]}};for(const line of (text||'').split('\n')){if(line.startsWith('```')){flush();code=!code;continue}if(!code&&/^#{1,6} /.test(line)){flush();box.append(el('h4',line.replace(/^#+ /,'')))}else if(!code&&!line.trim()){flush()}else buf.push(line)}flush();return box}
function detail(title,text){const d=el('details');d.append(el('summary',title),markdown(text));return d}
function card(title){const c=el('section',undefined,'card');c.append(el('h3',title));return c}
function bodyFor(ai){const j=DATA.jobs[JOB];if(j.kind==='論文')return j.answers[ai].body;return j.questions.find(q=>q.id===Q)?.ai[ai]?.body||''}
function secFor(ai){const j=DATA.jobs[JOB];if(j.kind==='論文')return j.answers[ai].sections;const q=j.questions.find(q=>q.id===Q);return Object.entries(q?.ai[ai]?.sections||{}).map(([title,body])=>({title,body}))}
function navigate(job,mode='study'){JOB=job;MODE=mode;render()}
function sectionBy(ai,word){return secFor(ai).find(x=>x.title.includes(word))?.body||''}
function textCard(title,text){const c=card(title);c.append(markdown(text));return c}
function causalCard(cause){const c=card('なぜそうなるか · '+cause.title);c.append(el('p',cause.intro));c.append(el('pre',JOB===0?'選任決議① → Aらの取締役会 → Bの代表取締役選定 → Bの招集 → 選任決議②\n①が存在しないとき、どの権限の根拠が欠けるかを順にたどる。':'A（株主） ─ 出資 → 会社X（事業・債権者のための財産）\nA（株主） ─ 株式を譲渡 → B（買主）\nA（株主） ← 代金 ─ B（買主）\n会社Xの財産を減らさず、Aが投下資本を回収'));
 const ol=el('ol');cause.steps.forEach(t=>ol.append(el('li',t)));c.append(ol,el('p',cause.exception,'warning'),el('p',cause.distinction));const refs=el('details');refs.append(el('summary','根拠と参考資料を確認（任意）'));for(const r of cause.sources){const a=el('a',r.title);a.href=r.url;a.target='_blank';a.rel='noopener';refs.append(el('p'));refs.lastChild.append(a)}if(JOB===0&&Q==='Q62'){const a=el('a','第三者解説：明徳法律事務所「議事録はあるのに総会がない」');a.href='https://meitoku-law.jp/rensai/417/';a.target='_blank';a.rel='noopener';refs.append(a,el('p','初〜中級。目次4「不存在・取消し・無効の境界」→5「後続決議への影響」。後の招集権限まで問題になる理由を確認します。全文を読む必要はありません。'),el('p','裁判所の区分一覧は1ページの最上段と最下段を対比。余裕があれば3ページの全員出席総会も確認します。'))}c.append(refs,el('p',cause.provenance,'muted'));return c}
function study(){const job=DATA.jobs[JOB],out=$('content'),essay=job.kind==='論文',f=DATA.fused?.[Q];out.append(el('h2',essay?'論文 第6問 · 株式譲渡の自由とその制限':`短答 ${Q}`));out.append(el('p','主文と補足を一つの流れに整理しています。元の2回答は下部の「出典・原文」に保存。両AIの一致だけで正確さが確定するわけではありません。','muted'));
 if(essay){out.append(textCard('要するに',sectionBy('ChatGPT','ひとことで')));const cause=DATA.explanations?.['論文第6問'];if(cause)out.append(causalCard(cause));out.append(textCard('判断の骨組み',sectionBy('ChatGPT','論述の骨格')));const rules=textCard('条文・規範と例外の補足',sectionBy('ChatGPT','規範カード'));rules.append(el('p','要確認：単元未満株式に関する制度説明が両AIで異なります。資料の時点と現行条文を照合してください。','warning'),detail('点検上の留意点（保存済み補足）',sectionBy('Claude','要確認')));out.append(rules,textCard('本問への適用 · 私の答案との照合',sectionBy('ChatGPT','私の答案')))}
 else if(f){out.append(textCard('要するに',f.summary));if(f.warning)out.append(el('p',f.warning,'warning'));const cause=DATA.explanations?.[Q];if(cause)out.append(causalCard(cause));out.append(textCard('具体的な関係・判断の骨組み',f.diagram));const source=card('条文・判例・例外の補足');source.append(detail('条文と規範を確認',f.rules),detail('判例の条件を確認',f.precedents));out.append(source);const app=card('本問の事実・理由・結論');for(const a of f.application){const c=el('section');c.append(el('h4',`${a.limb} · ${a.judgment}`));if(a['要確認'])c.append(el('p',a['要確認'],'warning'));c.append(formatted('p',a['理由']||''));if(a['補足'])c.append(formatted('p','補足：'+a['補足']));if(a['切るポイント'])c.append(formatted('p','本問で見る言葉：'+a['切るポイント']));if(a['根拠'])c.append(el('p','根拠：'+a['根拠'],'muted'));if(a['直すと'])c.append(formatted('p','正しく言い換えると：'+a['直すと']));app.append(c)}out.append(app,textCard('次に解くときの順番',f.next));out.append(el('p',f.note,'muted'))}
 else out.append(textCard('保存済みの説明',bodyFor('ChatGPT')));
 out.append(makeQuiz());const originals=card('出典・原文（必要なときだけ開く）');const grid=el('div',undefined,'grid');for(const ai of ['ChatGPT','Claude']){const c=el('section');c.append(detail(ai+' · 保存済み原文を開く',bodyFor(ai)));grid.append(c)}const parallel=el('button','原文を並べて比較（広い画面）');parallel.onclick=()=>grid.classList.toggle('compare');originals.append(parallel,grid);out.append(originals);const media=el('button','本日の音声・図解へ');media.onclick=()=>{MODE='media';render();window.scrollTo(0,0)};out.append(media);const refs=card('原資料');addMaterials(refs,job);out.append(refs)}
function makeQuiz(){const job=DATA.jobs[JOB],cause=job.kind==='短答'?DATA.explanations?.[Q]:DATA.explanations?.['論文第6問'];const quiz=card('何も見ずに思い出す');quiz.id='quiz';if(job.kind==='論文'){for(const item of job.answers.ChatGPT.recall){quiz.append(el('h4',item.title),el('p',item.question),detail('答えと根拠を開く',item.answer))}}else{quiz.append(el('p',cause?.recall_question||`${Q}の結論と、その判断を分ける言葉を説明してください。`));if(cause)quiz.append(detail('権限のつながりと例外を確認',cause.recall_answer));const refs=secFor('ChatGPT').filter(v=>/結論|次回の解き方/.test(v.title));quiz.append(detail('答えと解き方を確認',refs.map(v=>v.body).join('\n\n')))}quiz.append(el('p','答えは保存済み回答から引用しています。','muted'));appendRecallRecord(quiz);return quiz;
}
function recallKey(){return 'core_recall_'+DATA.jobs[JOB].id+'_'+(JOB===1?'essay6':Q)}
function localDay(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function appendRecallRecord(c){
 const panel=card('理解度と次回復習を記録');
 panel.append(el('p','この端末・このブラウザだけに保存します。iPadや既存の復習フィードへは自動同期しません。','muted'));
 const memoLabel=el('label','自分の説明・答案メモ'),memo=el('textarea');memo.id='recall-memo';memoLabel.append(memo);
 const gradeLabel=el('label','答えを確認した後の理解度'),grade=el('select');grade.id='recall-grade';
 for(const [value,text] of [['','選んでください'],['0','まだ説明できない'],['1','一部は説明できる'],['2','理由まで説明できる']]){const o=el('option',text);o.value=value;grade.append(o)}gradeLabel.append(grade);
 const dueLabel=el('label','次回復習日（自分で変更できます）'),due=el('input');due.type='date';due.id='recall-due';let tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);due.value=localDay(tomorrow);dueLabel.append(due);
 const status=el('p','','muted');status.id='recall-status';
 try{const old=JSON.parse(localStorage.getItem(recallKey())||'null');if(old){memo.value=old.memo||'';grade.value=String(old.grade);due.value=old.due;status.textContent=`保存済み：理解度 ${old.grade} / 次回 ${old.due}`}}catch{}
 const save=el('button','理解度と次回復習をこのブラウザに保存');save.id='recall-save';save.onclick=()=>{
  if(grade.value===''||!due.value){status.textContent='理解度と次回復習日を選んでください。まだ保存していません。';return}
  const item={job:DATA.jobs[JOB].id,kind:DATA.jobs[JOB].kind,qid:JOB===1?'第6問':Q,grade:Number(grade.value),memo:memo.value,due:due.value,saved:new Date().toISOString()};
  try{localStorage.setItem(recallKey(),JSON.stringify(item));status.textContent=`保存しました：理解度 ${item.grade} / 次回 ${item.due}。このブラウザ限定です。`;showRecallQueue()}catch{status.textContent='保存できませんでした。ブラウザの保存設定を確認してください。'}
 };
 panel.append(memoLabel,gradeLabel,dueLabel,save,status);c.append(panel);
 const queue=card('このブラウザの次回復習');queue.id='recall-queue';c.append(queue);
 const feed=el('a','既存の復習フィードを別に開く');feed.href='https://osamuina8008.github.io/business-tools/study/review.html';feed.target='_blank';feed.rel='noopener';c.append(feed,el('p','上の記録はこの比較画面の復習一覧に残ります。既存フィードへの登録・通知ではありません。','muted'));
 setTimeout(showRecallQueue,0);
}
function showRecallQueue(){const c=$('recall-queue');if(!c)return;c.replaceChildren(el('h3','このブラウザの次回復習'));let items=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key.startsWith('core_recall_'))try{items.push(JSON.parse(localStorage.getItem(key)))}catch{}}items.sort((a,b)=>a.due.localeCompare(b.due));if(!items.length)c.append(el('p','まだ記録はありません。答えを確認し、理解度と次回復習日を保存してください。'));for(const item of items){const b=el('button',`${item.due} · ${item.kind} ${item.qid} · 理解度 ${item.grade}`);b.onclick=()=>{const n=DATA.jobs.findIndex(j=>j.id===item.job);if(n<0)return;JOB=n;if(n===0)Q=item.qid;MODE='review';render();window.scrollTo(0,0)};c.append(b)}}
function mediaPage(){const out=$('content');out.append(el('h2','音声・図解 · 本日の6成果物'),el('p','音声は論文を題材にした1本です。短答・論文で追加生成せず、同じ日の6点をここから開けます。'));
 for(const m of DATA.media.items){const c=card(`${m.kind} / ${m.type} · ${m.title}`);c.append(el('p',m.status,'muted'));
 if(m.type==='音声'&&['127.0.0.1','localhost'].includes(location.hostname)){const a=el('audio');a.id='daily-audio';a.controls=true;a.preload='metadata';a.src='/media/audio';a.style.width='100%';c.append(el('p','このMacに保存済みの音声を再生（5分50秒）'),a);a.onerror=()=>c.append(el('p','ローカル音声を読み込めません。下のNotebookLMから開いてください。','warning'))}
 const a=el('a',m.type==='音声'?'NotebookLMで同じ音声を開く（一覧の同名項目）':'NotebookLMで開く');a.href=m.url;a.target='_blank';a.rel='noopener';c.append(a);out.append(c)}out.append(el('p',DATA.media.note,'muted'));
}
function reviewPage(){const j=DATA.jobs[JOB];$('content').append(el('h2',j.kind==='論文'?'論文 第6問 · 想起して復習':`短答 ${Q} · 想起して復習`),makeQuiz())}
function addMaterials(c,job){job.answers.ChatGPT.materials.forEach((m,i)=>{const p=el('p'),a=el('a',`${m.role} · ${m.name}`);a.href=m.url||'#';if(!m.url){a.removeAttribute('href');a.textContent+='（Macの原資料から確認）'}a.target='_blank';a.rel='noopener';p.append(a);c.append(p)})}
function audit(){const out=$('content'),j=DATA.jobs[JOB];out.append(el('h2',j.kind+' '+j.qid+' · 工程の証拠'));for(const ai of ['ChatGPT','Claude']){const a=j.answers[ai],c=card(ai),grid=el('div',undefined,'status');for(const[k,v]of Object.entries(a.stages))grid.append(el('div',k+'\n'+v));c.append(grid,el('p',`保存本文：${a.bytes.toLocaleString()} bytes / 更新 ${a.modified}`,'muted'),el('p',a.validation_error?'検証エラー：'+a.validation_error:'旧検証規則を通過。新しい論文見出しは全文を保持。','muted'),detail('入力・保存先・ハッシュ',JSON.stringify({input_sha256:a.input_sha256,prompt_sha256:a.prompt_sha256,answer_sha256:a.sha256,path:a.path,collected_ids:a.collected_ids},null,2)));out.append(c)}const c=card('原資料への入口');addMaterials(c,j);out.append(c);const d=card('公開の状態');d.append(el('p',DATA.public.status+'。'+DATA.public.reason));if(DATA.public.failed_run){const a=el('a','過去に失敗したGitHub Pages処理');a.href=DATA.public.failed_run;a.target='_blank';d.append(a)}out.append(d)}
function ab(){const c=card('標準は変えず、A/Bを選ぶ');c.append(el('p','Aは従来の6 AI画面、Bはこの2 AI画面です。新たな学習法の採用は、選択を受けてから検討します。'));const a=el('a','A · 従来の画面を開く','button');a.href='https://osamuina8008.github.io/business-tools/study/ai/';a.target='_blank';c.append(a,el('p','比較時は同程度の問題・同じ学習時間で、翌日に想起・理由説明・当てはめを確認します。現在のBは表示の試用であり、改善効果は未検証です。','muted'));for(const[id,label,options]of [['preference','使いやすさの好み',['未選択','A 従来','B 2 AI']],['recall','翌日の想起',['未測定','0 再現できない','1 一部','2 再現できる']],['reason','翌日の理由説明',['未測定','0 説明できない','1 一部','2 説明できる']],['apply','翌日の当てはめ',['未測定','0 結べない','1 一部','2 事実と規範を結べる']]]){const l=el('label',label+' '),s=el('select');s.id=id;options.forEach(t=>s.append(el('option',t)));l.append(s);c.append(l)}const l=el('label','問題・学習時間・メモ（好みと成果を分けて記録）'),t=el('textarea');t.id='memo';l.append(t);c.append(l);const save=el('button','この端末に試用結果を保存');save.onclick=()=>{const r={date:new Date().toISOString(),kind:DATA.jobs[JOB].kind,qid:Q};['preference','recall','reason','apply','memo'].forEach(id=>r[id]=$(id).value);localStorage.setItem('core_ab_'+DATA.jobs[JOB].id+'_'+Q,JSON.stringify(r));$('saved').textContent='この端末に保存しました。標準の切替・外部への送信は行いません。'};c.append(save,el('p','','muted'));c.lastChild.id='saved';$('content').append(c)}
function render(){const j=DATA.jobs[JOB];$('content').replaceChildren();$('qnav').replaceChildren();$('tanto').classList.toggle('on',JOB===0);$('essay').classList.toggle('on',JOB===1);if(['study','review'].includes(MODE)&&j.kind==='短答'){const nav=el('nav');j.questions.forEach(q=>{const b=el('button',q.id+(q.available?'':' 資料なし'));b.classList.toggle('on',q.id===Q);b.disabled=!q.available;b.onclick=()=>{Q=q.id;render()};nav.append(b)});$('qnav').append(nav)}if(MODE==='audit')audit();else if(MODE==='ab')ab();else if(MODE==='media')mediaPage();else if(MODE==='review')reviewPage();else study();$('mediajump').classList.toggle('on',MODE==='media');$('reviewjump').classList.toggle('on',MODE==='review')}

async function loadHistory(){const out=$('history-list');try{
 const local=['127.0.0.1','localhost'].includes(location.hostname),r=await fetch(local?'/history-manifest.json':'../data/manifest.json',{cache:'no-cache'});if(!r.ok)throw new Error('取得できません');const m=await r.json();out.replaceChildren();const groups=new Map();for(const row of m.days||[]){const date=row.day.slice(0,10),key=date+' '+row.subject;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row)}
 for(const [key,rows] of [...groups].sort((a,b)=>b[0].localeCompare(a[0]))){const c=el('section');if(key==='2026-11-01 商法')c.className='current';c.append(el('h4',key+(key==='2026-11-01 商法'?' · 表示中':'')));for(const row of rows){const essay=/★|論文/.test(row.day),label=essay?'論文':'短答';if(key==='2026-11-01 商法'){const b=el('button',label+' · 新版');b.onclick=()=>navigate(essay?1:0);c.append(b);const rev=el('button',label+' · 想起して復習');rev.onclick=()=>navigate(essay?1:0,'review');c.append(rev)}else{const a=el('a',label+' · 旧記録を開く');a.href='https://osamuina8008.github.io/business-tools/study/ai/#'+encodeURIComponent(row.day)+'/'+encodeURIComponent(row.qs?.[0]?.id||'');a.target='_blank';a.rel='noopener';c.append(a)}}out.append(c)}
 }catch{out.textContent='日付一覧を取得できませんでした。従来の6AI画面から履歴を開けます。';const a=el('a','従来の履歴を開く');a.href='https://osamuina8008.github.io/business-tools/study/ai/';out.append(a)}}
loadHistory();
$('mediajump').onclick=()=>{MODE='media';render();window.scrollTo(0,0)};$('reviewjump').onclick=()=>{MODE='review';render();window.scrollTo(0,0)};$('tanto').onclick=()=>navigate(0);$('essay').onclick=()=>navigate(1);$('audit').onclick=()=>{MODE='audit';render()};$('ab').onclick=()=>{MODE='ab';render()};fetch('snapshot.json?v=商法1101-v1.5',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;const h=decodeURIComponent(location.hash);if(h.includes('ronbun'))JOB=1;const q=h.match(/Q(62|63|64|65|69|70)/);if(q)Q=q[0];render();if(h.includes('media')){MODE='media';render()}}).catch(e=>{$('content').textContent='データを読み込めませんでした。'+e.message});
</script></html>
