<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="復習Chat">
  <meta name="theme-color" content="#0f172a">
  <title>予備試験 復習Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0f172a;
      --surf:     #1e293b;
      --surf2:    #0f172a;
      --border:   #334155;
      --acc:      #3b82f6;
      --acc2:     #7c3aed;
      --ai-bub:   #1e3a5f;
      --u-bub:    #1e293b;
      --text:     #f1f5f9;
      --dim:      #94a3b8;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --rad:      16px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 15px; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }

    #app { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto; }

    /* ─ ヘッダー ─ */
    header { display: flex; align-items: center; gap: 10px; padding: 11px 14px;
      background: var(--surf); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    header h1 { flex: 1; font-size: 14px; font-weight: 700; }
    header p  { font-size: 11px; color: var(--dim); }
    .badge { font-size: 12px; font-weight: 600;
      background: linear-gradient(135deg, var(--acc2), var(--acc));
      color: #fff; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
    .icon-btn { background: none; border: none; color: var(--dim); font-size: 18px;
      cursor: pointer; padding: 4px 6px; border-radius: 6px; }
    .icon-btn:active { background: var(--border); }

    /* ─ 科目バー ─ */
    #subj-bar { display: flex; gap: 6px; padding: 8px 12px;
      background: var(--surf); border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
    #subj-bar::-webkit-scrollbar { display: none; }
    .sbt { flex-shrink: 0; font-size: 12px; padding: 4px 12px; border-radius: 14px;
      border: 1px solid var(--border); background: transparent; color: var(--dim); cursor: pointer; }
    .sbt.on { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }

    /* ─ 共通ボタン ─ */
    .primary-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--acc2), var(--acc));
      color: #fff; border: none; border-radius: 24px; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 16px rgba(59,130,246,.3); }
    .primary-btn:disabled { opacity: .5; cursor: not-allowed; }
    .primary-btn:active:not(:disabled) { transform: scale(.98); }
    .sec-btn { padding: 10px 20px; background: var(--surf); border: 1px solid var(--border);
      border-radius: 20px; color: var(--dim); font-size: 14px; cursor: pointer; }
    .sec-btn:active { background: var(--border); }

    /* ─ API設定画面 ─ */
    #setup-screen { flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 28px 20px; text-align: center; }
    #setup-screen .big { font-size: 52px; }
    #setup-screen h2 { font-size: 18px; font-weight: 700; }
    #setup-screen p  { font-size: 13px; color: var(--dim); line-height: 1.7; }
    .link { color: var(--acc); text-decoration: none; }
    .api-in { width: 100%; background: var(--surf); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; }
    .api-in:focus { border-color: var(--acc); }

    /* ─ スタート画面 ─ */
    #start-screen { flex: 1; display: flex; flex-direction: column; gap: 12px;
      padding: 14px 14px; overflow-y: auto; }
    #start-screen h2 { font-size: 15px; font-weight: 700; color: var(--text); }
    .ctx-card { background: var(--surf); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; }
    .ctx-card .card-title { font-size: 11px; font-weight: 600; color: var(--dim);
      letter-spacing: .06em; margin-bottom: 8px; }
    .ctx-card .subj-big { font-size: 22px; font-weight: 700; color: var(--text); }
    .ctx-card .status-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .status-dot.gray { background: var(--dim); }
    .ctx-card .status-text { font-size: 12px; color: var(--dim); }
    .kw-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .kw-chip { font-size: 12px; background: rgba(59,130,246,.15); border: 1px solid rgba(59,130,246,.3);
      color: #93c5fd; padding: 3px 10px; border-radius: 12px;
      cursor: pointer; text-decoration: none; display: inline-block; }
    .kw-chip:active { background: rgba(59,130,246,.3); }
    .wq-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .wq-chip { font-size: 12px; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35);
      color: #fcd34d; padding: 3px 10px; border-radius: 12px;
      cursor: pointer; text-decoration: none; display: inline-block; }
    .wq-chip:active { background: rgba(245,158,11,.25); }

    /* スペーシング一覧 */
    .spacing-list { display: flex; flex-direction: column; gap: 6px; }
    .sp-item { background: var(--surf); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sp-left { flex: 1; min-width: 0; }
    .sp-subj { font-size: 13px; font-weight: 600; color: var(--text); }
    .sp-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .sp-kws  { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .sp-kw-btn { font-size: 11px; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35);
      color: #fcd34d; padding: 2px 8px; border-radius: 10px;
      text-decoration: none; display: inline-block; white-space: nowrap; }
    .sp-kw-btn:active { background: rgba(245,158,11,.25); }
    .sp-action-row { display: flex; gap: 6px; margin-top: 6px; }
    .sp-note-btn { font-size: 11px; background: rgba(204,102,51,.18); border: 1px solid rgba(204,102,51,.4);
      color: #f0956a; padding: 3px 10px; border-radius: 10px;
      text-decoration: none; display: inline-block; white-space: nowrap; }
    .sp-note-btn:active { background: rgba(204,102,51,.35); }
    .sp-claude-btn { font-size: 11px; background: rgba(139,92,246,.18); border: 1px solid rgba(139,92,246,.4);
      color: #c4b5fd; padding: 3px 10px; border-radius: 10px;
      cursor: pointer; white-space: nowrap; }
    .sp-claude-btn:active { background: rgba(139,92,246,.35); }

    /* ─ スケジュール ─ */
    #sched-section { margin-top: 4px; }
    #sched-toggle { width: 100%; background: var(--surf); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 13px;
      text-align: left; cursor: pointer; display: flex; justify-content: space-between; }
    #sched-toggle:active { background: var(--border); }
    #sched-body { display: none; background: var(--surf); border: 1px solid var(--border);
      border-top: none; border-radius: 0 0 10px 10px; max-height: 260px; overflow-y: auto; }
    #sched-body.open { display: block; }
    .sched-row { display: flex; align-items: center; gap: 10px; padding: 7px 14px;
      border-bottom: 1px solid var(--border); font-size: 13px; }
    .sched-row:last-child { border-bottom: none; }
    .sched-time { font-size: 12px; color: var(--dim); width: 42px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .sched-act  { flex: 1; color: var(--text); }
    .sched-row.now { background: rgba(59,130,246,.12); }
    .sched-row.now .sched-act { color: #93c5fd; font-weight: 600; }

    /* ─ チャット ─ */
    #chat-area { flex: 1; overflow-y: auto; padding: 12px 12px 6px;
      display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .msg { display: flex; flex-direction: column; gap: 2px; }
    .msg.user { align-items: flex-end; }
    .msg.ai   { align-items: flex-start; }
    .bub { max-width: 86%; padding: 10px 14px; border-radius: var(--rad);
      font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg.user .bub { background: var(--u-bub); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
    .msg.ai   .bub { background: var(--ai-bub); border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; color: var(--dim); padding: 0 4px; }

    .typing { background: var(--ai-bub); border-radius: var(--rad); border-bottom-left-radius: 4px;
      padding: 12px 16px; display: inline-flex; gap: 5px; align-items: center; }
    .dot { width: 7px; height: 7px; background: var(--dim); border-radius: 50%; animation: bop 1.2s infinite; }
    .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
    @keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

    /* ─ クイック ─ */
    #quick { display: flex; gap: 6px; padding: 6px 10px; overflow-x: auto;
      flex-shrink: 0; scrollbar-width: none; }
    #quick::-webkit-scrollbar { display: none; }
    .qb { flex-shrink: 0; font-size: 12px; padding: 6px 14px; border-radius: 18px;
      border: 1px solid var(--border); background: var(--surf); color: var(--text);
      cursor: pointer; white-space: nowrap; }
    .qb:active { background: var(--border); }

    /* ─ 入力 ─ */
    #input-row { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: var(--surf); border-top: 1px solid var(--border); flex-shrink: 0; }
    #msg-in { flex: 1; background: var(--surf2); border: 1px solid var(--border);
      border-radius: 20px; padding: 9px 14px; color: var(--text); font-size: 15px;
      outline: none; resize: none; min-height: 40px; max-height: 120px; line-height: 1.4; }
    #msg-in:focus { border-color: var(--acc); }
    #msg-in::placeholder { color: var(--dim); }
    #send { width: 40px; height: 40px; border-radius: 50%; background: var(--acc);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #send:disabled { background: var(--border); cursor: not-allowed; }
    #send svg { width: 17px; height: 17px; fill: #fff; }

    .hidden { display: none !important; }

    /* ─ ローディング ─ */
    .loading-row { display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 20px; color: var(--dim); font-size: 13px; }
    .spin { width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--acc); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="app">

  <!-- ヘッダー -->
  <header>
    <span style="font-size:20px">📖</span>
    <div style="flex:1">
      <h1>予備試験 復習Chat</h1>
      <p id="hd-date">--</p>
    </div>
    <span class="badge" id="hd-subj">--</span>
    <button class="icon-btn" id="font-btn" title="文字サイズ" style="font-size:14px;font-weight:700">A</button>
    <button class="icon-btn" id="reset-btn" title="リセット">↺</button>
  </header>

  <!-- 科目バー -->
  <div id="subj-bar">
    <button class="sbt" data-s="憲法">憲法</button>
    <button class="sbt" data-s="民法">民法</button>
    <button class="sbt" data-s="刑法">刑法</button>
    <button class="sbt" data-s="行政法">行政法</button>
    <button class="sbt" data-s="民訴法">民訴法</button>
    <button class="sbt" data-s="刑訴法">刑訴法</button>
    <button class="sbt" data-s="商法">商法</button>
  </div>

  <!-- ① APIキー設定画面 -->
  <div id="setup-screen" class="hidden">
    <div class="big">🔑</div>
    <h2>初回設定</h2>
    <p>
      Groq API キーを入力してください。<br>
      完全無料（1日14,400回）。<br><br>
      取得先 →
      <a class="link" href="https://console.groq.com/keys" target="_blank">
        console.groq.com/keys
      </a><br>
      <span style="font-size:11px">（Googleアカウントでログイン → Create API key）</span>
    </p>
    <input id="api-key-input" class="api-in" type="password" placeholder="gsk_...">
    <button id="save-key-btn" class="primary-btn" disabled>設定して始める</button>
    <p style="font-size:11px;color:var(--dim)">キーはこのブラウザのみに保存されます</p>
  </div>

  <!-- ② スタート画面（コンテキスト表示） -->
  <div id="start-screen" class="hidden">
    <h2>📋 今日の復習内容</h2>
    <!-- 今日の学習 -->
    <div class="ctx-card" id="today-card">
      <div class="card-title">TODAY — 今日の学習</div>
      <div class="subj-big" id="today-subj">--</div>
      <div class="status-row">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-text" id="status-text">読み込み中...</div>
      </div>
      <div class="kw-list" id="kw-list"></div>
      <div class="wq-list" id="wq-list"></div>
    </div>

    <!-- スペーシング復習 -->
    <div id="spacing-section" class="hidden">
      <h2 style="margin-top:4px">🔄 スペーシング復習</h2>
      <div class="spacing-list" id="spacing-list"></div>
    </div>

    <!-- スケジュール（折りたたみ） -->
    <div id="sched-section" class="hidden">
      <button id="sched-toggle">📅 今日のスケジュール <span id="sched-arrow">▼</span></button>
      <div id="sched-body"></div>
    </div>

    <div style="display:flex; gap:8px; margin-top:4px">
      <button class="sec-btn" id="refresh-ctx-btn">🔄 再読み込み</button>
      <button class="primary-btn" id="start-btn" style="flex:2" disabled>復習を開始する →</button>
    </div>
    <p style="font-size:11px;color:var(--dim);text-align:center">
      ※ 毎朝7時にMacから自動更新されます
    </p>
  </div>

  <!-- ③ チャット -->
  <div id="chat-area" class="hidden"></div>

  <!-- クイック返信 -->
  <div id="quick" class="hidden">
    <button class="qb" data-m="次の問題をお願いします">▶ 次の問題</button>
    <button class="qb" id="qb-2択" data-m="同じ問題を2択（A/Bの選択肢形式）で出してください">🅰 2択</button>
    <button class="qb" data-m="もう一度説明してください">🔁 もう一度</button>
    <button class="qb" data-m="ヒントをください">💡 ヒント</button>
    <button class="qb" data-m="スペーシング復習の問題を出してください">🔄 復習問題</button>
    <button class="qb" data-m="終わります">🏁 終了</button>
  </div>

  <!-- 入力欄 -->
  <div id="input-row" class="hidden">
    <textarea id="msg-in" placeholder="回答を入力..." rows="1"></textarea>
    <button id="send" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════
// 定数
// ══════════════════════════════════════════════════

// 曜日 → 科目（JS getDay: 0=日,1=月,...,6=土）
const WEEKLY = {0:"商法",1:"憲法",2:"民法",3:"刑法",4:"行政法",5:"民訴法",6:"刑訴法"};

// Groq（完全無料、OpenAI互換）
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const GROQ_MODEL = "llama-3.3-70b-versatile";

// GitHub Raw — 毎回最新を取得（キャッシュバスター付き）
const CTX_URL = () =>
  `https://raw.githubusercontent.com/osamuina8008/business-tools/main/study/context.json?t=${Date.now()}`;

// ══════════════════════════════════════════════════
// 状態
// ══════════════════════════════════════════════════
let apiKey  = localStorage.getItem("groq_api_key") || "";
let subject = WEEKLY[new Date().getDay()];
let ctx     = null;   // GitHubから取得したコンテキスト
let history = [];
let busy    = false;

// ══════════════════════════════════════════════════
// DOM
// ══════════════════════════════════════════════════
const $  = id => document.getElementById(id);
const setupScreen = $("setup-screen");
const startScreen = $("start-screen");
const chatArea    = $("chat-area");
const quick       = $("quick");
const inputRow    = $("input-row");

// ══════════════════════════════════════════════════
// 初期化
// ══════════════════════════════════════════════════
function init() {
  const now  = new Date();
  const days = ["日","月","火","水","木","金","土"];
  $("hd-date").textContent = `${now.getMonth()+1}月${now.getDate()}日（${days[now.getDay()]}）`;
  $("hd-subj").textContent = subject;
  highlightSubj(subject);

  if (!apiKey) {
    show(setupScreen);
  } else {
    show(startScreen);
    loadContext();
  }
}

function show(el) {
  [setupScreen, startScreen, chatArea, quick, inputRow].forEach(e => e.classList.add("hidden"));
  el.classList.remove("hidden");
}
function showChat() {
  chatArea.classList.remove("hidden");
  quick.classList.remove("hidden");
  inputRow.classList.remove("hidden");
  [setupScreen, startScreen].forEach(e => e.classList.add("hidden"));
}

// ══════════════════════════════════════════════════
// コンテキスト読み込み（GitHub Raw）
// ══════════════════════════════════════════════════
async function loadContext() {
  $("status-dot").className = "status-dot gray";
  $("status-text").textContent = "読み込み中...";
  $("start-btn").disabled = true;
  $("kw-list").innerHTML = "";
  $("wq-list").innerHTML = "";
  $("spacing-list").innerHTML = "";
  $("spacing-section").classList.add("hidden");

  try {
    const res  = await fetch(CTX_URL());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    ctx = await res.json();

    // 今日の科目（コンテキストの科目を優先）
    if (ctx.subject) {
      subject = ctx.subject;
      $("hd-subj").textContent = subject;
      highlightSubj(subject);
    }
    $("today-subj").textContent = subject;

    // ステータス
    const isToday = ctx.date === new Date().toISOString().slice(0, 10);
    $("status-dot").className = "status-dot" + (isToday ? "" : " gray");
    $("status-text").textContent = isToday
      ? `✅ 今日のノート取得済み（${ctx.updated_at?.slice(11,16)} 更新）`
      : `⚠️ ${ctx.date} のデータ（本日未更新）`;

    // キーワード（タップ → Bear検索）
    (ctx.keywords || []).forEach(kw => {
      const a = document.createElement("a");
      a.className = "kw-chip";
      a.textContent = "📖 " + kw;
      a.href = "bear://x-callback-url/search?term=" + encodeURIComponent(kw);
      $("kw-list").appendChild(a);
    });

    // 弱点トピック（マークダウン除去・タップ → Bear検索）
    const JUNK = ["能力不足","判断迷い","判断ミス","読解エラー","理解不十分","未整理","エラー","得点喪失"];
    const cleanTopic = t => t.replace(/\*\*/g, "").replace(/^[\s・]+/, "").trim();
    const wrongItems = (ctx.wrong_topics || [])
      .map(cleanTopic)
      .filter(t => t.length >= 2 && !JUNK.some(j => t.includes(j)));
    wrongItems.slice(0, 8).forEach(t => {
      const a = document.createElement("a");
      a.className = "wq-chip";
      a.textContent = "⚠️ " + t;
      a.href = "bear://x-callback-url/search?term=" + encodeURIComponent(t);
      $("wq-list").appendChild(a);
    });

    // スケジュール
    if (ctx.today_schedule?.length > 0) {
      $("sched-section").classList.remove("hidden");
      const body = $("sched-body");
      body.innerHTML = "";
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      ctx.today_schedule.forEach((e, i) => {
        const [h, m] = e.time.split(":").map(Number);
        const eMin = h * 60 + m;
        const nextMin = ctx.today_schedule[i+1]
          ? (() => { const [nh,nm]=ctx.today_schedule[i+1].time.split(":").map(Number); return nh*60+nm; })()
          : eMin + 60;
        const isCurrent = nowMin >= eMin && nowMin < nextMin;
        const row = document.createElement("div");
        row.className = "sched-row" + (isCurrent ? " now" : "");
        row.innerHTML = `<span class="sched-time">${e.time}</span><span class="sched-act">${isCurrent ? "▶ " : ""}${e.activity}</span>`;
        body.appendChild(row);
      });
      // 現在時刻付近まで自動スクロール
      const nowRow = body.querySelector(".now");
      if (nowRow) setTimeout(() => nowRow.scrollIntoView({block:"center"}), 100);
    }

    // スペーシング復習
    const today0 = new Date(); today0.setHours(0,0,0,0);
    const daysAgoLabel = dateStr => {
      const d = new Date(dateStr); d.setHours(0,0,0,0);
      const n = Math.round((today0 - d) / 86400000);
      return n === 0 ? "今日" : n === 1 ? "昨日" : n + "日前";
    };
    const validItems = (ctx.spacing_items || []).filter(it =>
      it.subject && it.subject !== "—" && (it.keywords || []).length > 0
    );
    if (validItems.length > 0) {
      $("spacing-section").classList.remove("hidden");
      validItems.forEach(item => {
        const el = document.createElement("div");
        el.className = "sp-item";
        const dLabel = item.interval_label || daysAgoLabel(item.date);
        const kwsHtml = (item.keywords || []).map(k =>
          `<a class="sp-kw-btn" href="bear://x-callback-url/search?term=${encodeURIComponent(k)}">🐻 ${k}</a>`
        ).join("");
        // Bear: その日付のノートを開く
        const bearDateUrl = `bear://x-callback-url/search?term=${encodeURIComponent(item.date)}`;
        // Claude: チャットを開いてその内容を質問
        const claudeQ = `${item.subject}（${item.date}・${(item.keywords||[]).join("/")}）について復習問題を出してください`;
        el.innerHTML = `
          <div class="sp-left">
            <div><span class="sp-subj">${item.subject}</span>
              <span style="font-size:11px;color:var(--dim);margin-left:6px">${item.date}</span>
            </div>
            <div class="sp-meta">${dLabel}に学習 → 今日復習推奨${item.questions_count > 0 ? "　" + item.questions_count + "問" : ""}</div>
            <div class="sp-kws">${kwsHtml}</div>
            <div class="sp-action-row">
              <a class="sp-note-btn" href="${bearDateUrl}">📓 ${item.date}のノート</a>
              <span class="sp-claude-btn" onclick="askClaude(${JSON.stringify(claudeQ)})">🤖 Claude に聞く</span>
            </div>
          </div>
        `;
        $("spacing-list").appendChild(el);
      });
    }

  } catch(e) {
    ctx = null;
    $("today-subj").textContent = subject;
    $("status-dot").className = "status-dot gray";
    $("status-text").textContent = "⚠️ データなし（基本問題モードで開始）";
  }

  $("start-btn").disabled = false;
}

// ══════════════════════════════════════════════════
// 科目バー
// ══════════════════════════════════════════════════
// スペーシング復習からClaudeに直接質問
function askClaude(question) {
  // チャットを開いてその質問を送信
  startChat();
  // 少し待ってから送信（チャット初期化後）
  setTimeout(() => send(question), 800);
}

function highlightSubj(s) {
  document.querySelectorAll(".sbt").forEach(b => b.classList.toggle("on", b.dataset.s === s));
}
document.querySelectorAll(".sbt").forEach(btn => {
  btn.addEventListener("click", () => {
    subject = btn.dataset.s;
    $("hd-subj").textContent = subject;
    highlightSubj(subject);
    if (!chatArea.classList.contains("hidden")) {
      send(`科目を${subject}に切り替えます。${subject}の問題を出してください。`);
    } else {
      $("today-subj").textContent = subject;
    }
  });
});

// ══════════════════════════════════════════════════
// APIキー設定
// ══════════════════════════════════════════════════
$("api-key-input").addEventListener("input", e => {
  $("save-key-btn").disabled = e.target.value.trim().length < 10;
});
$("save-key-btn").addEventListener("click", () => {
  const k = $("api-key-input").value.trim();
  if (!k) return;
  apiKey = k;
  localStorage.setItem("groq_api_key", k);
  show(startScreen);
  loadContext();
});

// ══════════════════════════════════════════════════
// スタート画面
// ══════════════════════════════════════════════════
$("start-btn").addEventListener("click", startChat);
$("refresh-ctx-btn").addEventListener("click", loadContext);

async function startChat() {
  history = [];
  showChat();
  await send("__start__");
}

// ══════════════════════════════════════════════════
// システムプロンプト生成
// ══════════════════════════════════════════════════
function buildSystem() {
  let todaySection = `## 今日の学習\n科目: ${subject}\n`;
  if (ctx) {
    if (ctx.keywords?.length) todaySection += `キーワード: ${ctx.keywords.join("、")}\n`;
    const JUNK2 = ["知識不足","得点喪失","読解エラー","理解不十分","未整理","レベル","エラー"];
    const wrongRef = (ctx.wrong_topics || []).filter(t => !JUNK2.some(j=>t.includes(j)) && t.length>=2);
    if (wrongRef.length) todaySection += `要注意キーワード・条文: ${wrongRef.slice(0,5).join("、")}\n`;
  }

  let spacingSection = "";
  if (ctx?.spacing_items?.length) {
    spacingSection = "\n## スペーシング復習（今日やるべき過去の内容）\n";
    ctx.spacing_items.forEach(item => {
      spacingSection += `- ${item.interval_label} [${item.subject} ${item.questions_count}問]`;
      if (item.keywords?.length) spacingSection += ` キーワード: ${item.keywords.join("、")}`;
      if (item.wrong_qs?.length) spacingSection += ` 間違い: ${item.wrong_qs.slice(0,3).join("、")}`;
      spacingSection += "\n";
    });
    spacingSection += "\n※ 今日の学習を先にやってから、スペーシング復習も含めること。";
  }

  return `あなたは司法試験予備試験の学習コーチです。ユーザーが今日学習した内容を会話形式で定着させます。

${todaySection}${spacingSection || "\n（スペーシング復習なし）"}

【ルール】
- スマホ向け：返答は短く（3〜5文以内）
- 難易度は「基本」から始める。知識の確認レベルで十分（応用・事例問題は不要）
- 最初（start）では今日の内容を1文で紹介し、すぐ基本確認問題を1問出す
- 問題形式：「❓ 〜は何ですか？」または「❓ 〜の要件を教えてください」
- 「2択」と言われたら：「A: ○○　B: ××　どちらですか？」の形式で出し直す
- 回答後：「✅ 正解！」または「💡 正解は〜」＋1〜2文の解説（条文番号を明記）
- 次の問題はユーザーが求めた時だけ
- キーワードや要注意条文を優先出題
- 「終わります」と言われたらお疲れ様メッセージで締める`;
}

// ══════════════════════════════════════════════════
// メッセージ送信
// ══════════════════════════════════════════════════
async function send(text) {
  if (busy) return;
  const isStart = text === "__start__";
  const userText = isStart ? "start" : text.trim();
  if (!userText) return;

  if (!isStart) addBubble("user", userText);
  $("msg-in").value = "";
  autoResize();
  $("send").disabled = true;
  busy = true;

  const typing = addTyping();

  try {
    if (!isStart) history.push({ role: "user", content: userText });

    const messages = [
      { role: "system", content: buildSystem() },
      ...(isStart
        ? [{ role: "user", content: "今日の復習を始めてください" }]
        : history),
    ];

    const res = await fetch(GROQ_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`,
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages,
        max_tokens: 600,
        temperature: 0.75,
      }),
    });
    const data = await res.json();
    typing.remove();

    if (data.error) {
      const msg = data.error.message || "不明なエラー";
      addBubble("ai", `⚠️ エラー: ${msg}\n\nAPIキーをリセットして再設定してください（↺ボタン）`);
    } else {
      const reply = data.choices?.[0]?.message?.content || "（応答なし）";
      addBubble("ai", reply);
      if (isStart) history.push({ role: "user", content: "今日の復習を始めてください" });
      history.push({ role: "assistant", content: reply });
    }
  } catch(e) {
    typing.remove();
    addBubble("ai", "⚠️ 通信エラー。インターネット接続を確認してください。");
  }

  busy = false;
  $("send").disabled = ($("msg-in").value.trim() === "");
  scrollBottom();
}

// ══════════════════════════════════════════════════
// DOM ヘルパー
// ══════════════════════════════════════════════════
function addBubble(role, text) {
  const row = document.createElement("div");
  row.className = `msg ${role}`;
  const bub = document.createElement("div");
  bub.className = "bub";
  bub.textContent = text;
  const t = document.createElement("div");
  t.className = "msg-time";
  t.textContent = new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  row.appendChild(bub);
  row.appendChild(t);
  chatArea.appendChild(row);
  scrollBottom();
}
function addTyping() {
  const row = document.createElement("div");
  row.className = "msg ai";
  row.innerHTML = `<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatArea.appendChild(row);
  scrollBottom();
  return row;
}
function scrollBottom() {
  requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
}
function autoResize() {
  const el = $("msg-in");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

// ══════════════════════════════════════════════════
// 入力 / クイック / リセット
// ══════════════════════════════════════════════════
$("msg-in").addEventListener("input", () => {
  autoResize();
  $("send").disabled = $("msg-in").value.trim() === "" || busy;
});
$("msg-in").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!$("send").disabled) send($("msg-in").value); }
});
$("send").addEventListener("click", () => { if (!$("send").disabled) send($("msg-in").value); });

document.querySelectorAll(".qb").forEach(b => {
  b.addEventListener("click", () => { if (!busy) send(b.dataset.m); });
});

// 文字サイズ切り替え（3段階: 15→18→21px）
const SIZES = [15, 18, 21];
let sizeIdx = parseInt(localStorage.getItem("font_size_idx") || "0");
function applyFontSize() {
  document.body.style.fontSize = SIZES[sizeIdx] + "px";
  $("font-btn").textContent = sizeIdx === 0 ? "A" : sizeIdx === 1 ? "A+" : "A++";
  $("font-btn").style.color = sizeIdx === 0 ? "" : "#93c5fd";
}
applyFontSize();
$("font-btn").addEventListener("click", () => {
  sizeIdx = (sizeIdx + 1) % SIZES.length;
  localStorage.setItem("font_size_idx", sizeIdx);
  applyFontSize();
});

$("sched-toggle").addEventListener("click", () => {
  const body = $("sched-body");
  const isOpen = body.classList.toggle("open");
  $("sched-arrow").textContent = isOpen ? "▲" : "▼";
});

$("reset-btn").addEventListener("click", () => {
  if (!confirm("リセットしますか？")) return;
  const keepKey = confirm("APIキーはそのままにしますか？");
  if (!keepKey) { localStorage.removeItem("groq_api_key"); apiKey = ""; }
  history = [];
  ctx = null;
  chatArea.innerHTML = "";
  init();
});

// ══════════════════════════════════════════════════
// 起動
// ══════════════════════════════════════════════════
init();
</script>
