<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スケジュール管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .event-row:hover { background: #f0f9ff; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="../index.html" class="text-gray-400 hover:text-gray-600 text-sm">← ツール一覧</a>
      <span class="text-gray-300">|</span>
      <h1 class="text-lg font-bold text-gray-800">スケジュール管理</h1>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- 左: イベント追加フォーム -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xs font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded">新規追加</span>
        <span class="text-sm font-semibold text-gray-700">予定を追加</span>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">件名 <span class="text-red-400">*</span></label>
          <input id="ev-title" type="text" placeholder="例: ABC商事 訪問・打ち合わせ"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-gray-600 block mb-1">日付 <span class="text-red-400">*</span></label>
            <input id="ev-date" type="date"
              class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 block mb-1">開始時間</label>
            <input id="ev-time-start" type="time" value="09:00"
              class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-gray-600 block mb-1">終了時間</label>
            <input id="ev-time-end" type="time" value="10:00"
              class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 block mb-1">種別</label>
            <select id="ev-category" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300 bg-white">
              <option value="visit">顧客訪問</option>
              <option value="meeting">社内会議</option>
              <option value="call">電話・WEB会議</option>
              <option value="expo">展示会</option>
              <option value="other">その他</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">場所</label>
          <input id="ev-location" type="text" placeholder="例: ABC商事 本社 / Zoom"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">メモ</label>
          <textarea id="ev-memo" rows="3" placeholder="担当者名、持参物、確認事項など"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300 resize-none"></textarea>
        </div>

        <div class="flex gap-2 pt-1">
          <button onclick="addEvent()"
            class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            ツールに追加
          </button>
          <button onclick="openGoogleCalendar()"
            class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-1.5 border border-blue-200">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            Googleカレンダーへ
          </button>
        </div>
      </div>
    </div>

    <!-- 右: 今後の予定一覧 -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded">予定一覧</span>
          <span class="text-sm font-semibold text-gray-700">今後のスケジュール</span>
        </div>
        <select id="cat-filter" onchange="renderEvents()"
          class="text-xs border border-gray-200 rounded-lg px-2 py-1 bg-white text-gray-600 focus:outline-none">
          <option value="all">すべて</option>
          <option value="visit">顧客訪問</option>
          <option value="meeting">社内会議</option>
          <option value="call">電話・WEB</option>
          <option value="expo">展示会</option>
          <option value="other">その他</option>
        </select>
      </div>

      <div id="event-list" class="flex-1 space-y-2 overflow-y-auto max-h-[500px]">
        <p class="text-sm text-gray-400 text-center py-8">予定はまだありません</p>
      </div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-sm px-4 py-2.5 rounded-xl opacity-0 transition-opacity pointer-events-none z-50">
    <span id="toast-msg"></span>
  </div>

<script>
const CAT_LABELS = { visit:'顧客訪問', meeting:'社内会議', call:'電話・WEB', expo:'展示会', other:'その他' };
const CAT_COLORS = {
  visit:  { bg:'bg-blue-100',   text:'text-blue-700',   border:'border-l-blue-500' },
  meeting:{ bg:'bg-purple-100', text:'text-purple-700', border:'border-l-purple-500' },
  call:   { bg:'bg-green-100',  text:'text-green-700',  border:'border-l-green-500' },
  expo:   { bg:'bg-orange-100', text:'text-orange-700', border:'border-l-orange-500' },
  other:  { bg:'bg-gray-100',   text:'text-gray-600',   border:'border-l-gray-400' },
};

function loadEvents() {
  return JSON.parse(localStorage.getItem('bt_events') || '[]');
}
function saveEvents(evs) {
  localStorage.setItem('bt_events', JSON.stringify(evs));
}

function addEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const date  = document.getElementById('ev-date').value;
  if (!title || !date) { showToast('件名と日付は必須です'); return; }

  const ev = {
    id: Date.now(),
    title,
    date,
    timeStart: document.getElementById('ev-time-start').value,
    timeEnd:   document.getElementById('ev-time-end').value,
    category:  document.getElementById('ev-category').value,
    location:  document.getElementById('ev-location').value.trim(),
    memo:      document.getElementById('ev-memo').value.trim(),
  };

  const evs = loadEvents();
  evs.push(ev);
  evs.sort((a,b) => (a.date+a.timeStart).localeCompare(b.date+b.timeStart));
  saveEvents(evs);
  renderEvents();
  clearForm();
  showToast('予定を追加しました');
}

function deleteEvent(id) {
  const evs = loadEvents().filter(e => e.id !== id);
  saveEvents(evs);
  renderEvents();
  showToast('削除しました');
}

function renderEvents() {
  const filter = document.getElementById('cat-filter').value;
  const today = new Date().toISOString().slice(0,10);
  let evs = loadEvents().filter(e => e.date >= today);
  if (filter !== 'all') evs = evs.filter(e => e.category === filter);

  const el = document.getElementById('event-list');
  if (evs.length === 0) {
    el.innerHTML = '<p class="text-sm text-gray-400 text-center py-8">該当する予定はありません</p>';
    return;
  }

  let lastDate = '';
  el.innerHTML = evs.map(ev => {
    const c = CAT_COLORS[ev.category] || CAT_COLORS.other;
    const dateHeader = ev.date !== lastDate
      ? `<p class="text-xs font-bold text-gray-500 mt-3 mb-1 first:mt-0">${formatDateLabel(ev.date)}</p>`
      : '';
    lastDate = ev.date;
    const days = Math.round((new Date(ev.date) - new Date(today)) / 86400000);
    const daysLabel = days === 0 ? '<span class="text-xs font-bold text-red-500 ml-1">今日</span>'
                    : days === 1 ? '<span class="text-xs font-bold text-orange-500 ml-1">明日</span>'
                    : days <= 7  ? `<span class="text-xs text-orange-400 ml-1">${days}日後</span>` : '';
    return `${dateHeader}
    <div class="event-row border-l-4 ${c.border} rounded-r-xl px-3 py-2.5 bg-gray-50 transition fade-in flex items-start gap-2">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-sm font-bold text-gray-800 truncate">${escHtml(ev.title)}</span>
          ${daysLabel}
        </div>
        <div class="flex items-center gap-2 mt-0.5 flex-wrap">
          <span class="text-xs ${c.text} ${c.bg} px-1.5 py-0.5 rounded-full font-medium">${CAT_LABELS[ev.category]}</span>
          <span class="text-xs text-gray-500">${ev.timeStart}〜${ev.timeEnd}</span>
          ${ev.location ? `<span class="text-xs text-gray-400">📍${escHtml(ev.location)}</span>` : ''}
        </div>
        ${ev.memo ? `<p class="text-xs text-gray-400 mt-1 truncate">${escHtml(ev.memo)}</p>` : ''}
      </div>
      <button onclick="deleteEvent(${ev.id})" class="text-gray-300 hover:text-red-400 flex-shrink-0 transition mt-0.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>`;
  }).join('');
}

function formatDateLabel(d) {
  const dt = new Date(d);
  const days = ['日','月','火','水','木','金','土'];
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日（${days[dt.getDay()]}）`;
}

function openGoogleCalendar() {
  const title = document.getElementById('ev-title').value.trim();
  const date  = document.getElementById('ev-date').value;
  if (!title || !date) { showToast('件名と日付は必須です'); return; }

  const ts = document.getElementById('ev-time-start').value.replace(':','');
  const te = document.getElementById('ev-time-end').value.replace(':','');
  const d  = date.replace(/-/g,'');
  const loc = document.getElementById('ev-location').value.trim();
  const memo = document.getElementById('ev-memo').value.trim();

  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE`
    + `&text=${encodeURIComponent(title)}`
    + `&dates=${d}T${ts}00/${d}T${te}00`
    + (loc  ? `&location=${encodeURIComponent(loc)}`  : '')
    + (memo ? `&details=${encodeURIComponent(memo)}` : '');
  window.open(url, '_blank');
}

function clearForm() {
  ['ev-title','ev-location','ev-memo'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('ev-time-start').value = '09:00';
  document.getElementById('ev-time-end').value   = '10:00';
  document.getElementById('ev-category').value   = 'visit';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2000);
}

// 今日の日付をデフォルトに
document.getElementById('ev-date').value = new Date().toISOString().slice(0,10);
renderEvents();
</script>
</body>
</html>
