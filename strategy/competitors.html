<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>競合管理（熱処理屋）</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    body { font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif; }
    .chip { white-space: nowrap; }
    .chip.active { background: #4c1d95; color: #fff; border-color: #4c1d95; }
    .blurb { line-height: 1.45; }
    .comp-alert-expand { color: #b91c1c; font-weight: 800; }
    .comp-alert-missing { color: #b91c1c; font-weight: 700; }
    .intel-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .intel-table th, .intel-table td { border: 1px solid #e2e8f0; padding: 4px 6px; text-align: left; }
    .intel-table th { background: #f1f5f9; font-weight: 600; }
    #comp-map { height: 320px; width: 100%; border-radius: 1rem; }
    .leaflet-container { font: inherit; z-index: 1; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <a href="./index.html" class="text-slate-400 hover:text-slate-600 text-sm">← 戦略と戦術</a>
      <span class="text-slate-300">|</span>
      <div>
        <h1 class="text-lg font-bold text-violet-900">競合管理</h1>
        <p class="text-xs text-slate-500">キーワードで設備・処理を検索。協力候補へ委託できる相手もここから</p>
      </div>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <span id="stat" class="text-slate-500"></span>
      <span id="crawl-stat" class="text-slate-400"></span>
      <button type="button" onclick="document.getElementById('map-section').scrollIntoView({behavior:'smooth'})"
        class="font-semibold text-white bg-violet-700 hover:bg-violet-800 px-3 py-1.5 rounded-lg">地図</button>
      <a href="./index.html" class="font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg">攻めどころ</a>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-4 space-y-4">

  <!-- クローリング重要アラート -->
  <section id="alerts-section" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-4">
    <div class="flex flex-wrap items-start justify-between gap-2 mb-2">
      <div>
        <h2 class="text-sm font-bold text-rose-900">クローリング重要更新</h2>
        <p class="text-[10px] text-rose-800/80 mt-0.5">公式HP差分を自動検出。誤検知あり得るので必ず確認。</p>
      </div>
      <span id="alerts-meta" class="text-[10px] text-rose-700"></span>
    </div>
    <div id="alerts-list" class="space-y-1.5 max-h-40 overflow-auto"></div>
  </section>

  <!-- この画面上の地図 -->
  <section id="map-section" class="bg-white rounded-2xl border border-violet-200 p-4 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
      <div>
        <h2 class="text-sm font-bold text-violet-950">競合マップ</h2>
        <p class="text-[10px] text-slate-500">フィルタ結果を地図表示。ピンクリックで右に詳細。位置は市区町村付近。</p>
      </div>
      <span id="map-meta" class="text-[10px] text-slate-500"></span>
    </div>
    <div id="comp-map" class="border border-slate-200"></div>
  </section>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

  <!-- 左: 検索 -->
  <aside class="lg:col-span-4 space-y-3">
    <section class="bg-white rounded-2xl border border-violet-200 p-4">
      <label class="block text-xs font-bold text-violet-900 mb-1">キーワード検索</label>
      <input id="q" type="search" placeholder="例: ガス窒化　窒化処理　真空　浸炭（空白でAND）"
        class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300"
        oninput="onSearch()" />
      <p class="mt-1 text-[10px] text-slate-400">処理名・設備名・社名で検索可。同義語（ガス窒化⇄窒化処理など）も拾います</p>
      <div class="mt-2 flex flex-wrap gap-1.5">
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-violet-300 bg-violet-100 text-violet-900 font-semibold"
          onclick="clearKeywordAndTopics()" title="キーワード検索と探すトピックを解除">キーワード・探す解除</button>
        <button type="button" class="kwchip text-[11px] px-2 py-1 rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-900" onclick="applyKeyword('ガス窒化')">ガス窒化</button>
        <button type="button" class="kwchip text-[11px] px-2 py-1 rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-900" onclick="applyKeyword('窒化処理')">窒化処理</button>
        <button type="button" class="kwchip text-[11px] px-2 py-1 rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-900" onclick="applyKeyword('軟窒化')">軟窒化</button>
        <button type="button" class="kwchip text-[11px] px-2 py-1 rounded-lg border border-sky-200 bg-sky-50 text-sky-900" onclick="applyKeyword('真空')">真空</button>
        <button type="button" class="kwchip text-[11px] px-2 py-1 rounded-lg border border-sky-200 bg-sky-50 text-sky-900" onclick="applyKeyword('浸炭')">浸炭</button>
        <button type="button" class="kwchip text-[11px] px-2 py-1 rounded-lg border border-sky-200 bg-sky-50 text-sky-900" onclick="applyKeyword('高周波')">高周波</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-teal-200 bg-teal-50 text-teal-900" onclick="applyPreset({tags:['協力候補'], query:'協力候補'})">協力候補</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-teal-200 bg-teal-50 text-teal-900" onclick="applyPreset({tags:['一部協業'], query:'一部協業'})">一部協業</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-teal-200 bg-teal-50 text-teal-900" onclick="applyPreset({tags:['委託先候補'], query:'委託先候補'})">委託先候補</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-sky-200 bg-sky-50 text-sky-900" onclick="applyPreset({tags:['炉メーカー'], query:'炉メーカー'})">炉メーカー</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-violet-200 bg-violet-50 text-violet-900" onclick="applyPreset({region:'京都・滋賀・奈良', query:'滋賀'})">滋賀</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-violet-200 bg-violet-50 text-violet-900" onclick="applyPreset({region:'京都・滋賀・奈良', query:'京都'})">京都</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-violet-200 bg-violet-50 text-violet-900" onclick="applyPreset({tags:['豊橋地区'], query:'豊橋 東三河'})">豊橋・東三河</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-amber-200 bg-amber-50 text-amber-900" onclick="applyPreset({tags:['委託型']})">委託型</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-rose-200 bg-rose-50 text-rose-800" onclick="applyPreset({tags:['増強']})">増強あり</button>
        <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-violet-200 bg-violet-50 text-violet-900" onclick="applyPreset({macro:'keihanshin'})">京阪神</button>
      </div>
      <div class="mt-3 pt-3 border-t border-slate-100">
        <p class="text-[10px] font-bold text-violet-900 mb-1.5">ポジション分類（設備から）</p>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-900" onclick="applyPosition('量産小物型')">量産小物型</button>
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-900" onclick="applyPosition('総合型')">総合型</button>
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-900" onclick="applyPosition('超大型型')">超大型型</button>
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-900" onclick="applyPosition('小～中ロット型')">小～中ロット型</button>
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-900" onclick="applyPosition('自動車・浸炭型')">自動車・浸炭型</button>
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-900" onclick="applyPosition('高周波専門型')">高周波専門</button>
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-900" onclick="applyPosition('窒化専門型')">窒化専門</button>
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-900" onclick="applyPosition('真空・光輝型')">真空・光輝</button>
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-slate-200 bg-slate-50" onclick="showEquipMap()">8項目マップ表</button>
        </div>
      </div>
    </section>

    <section class="bg-white rounded-2xl border border-slate-200 p-4">
      <div class="flex items-center justify-between mb-2 gap-2">
        <h2 class="text-sm font-bold text-slate-800">探す（約50問）</h2>
        <div class="flex items-center gap-2">
          <button type="button" class="text-[11px] px-2 py-1 rounded-lg border border-violet-300 bg-violet-100 text-violet-900 font-semibold whitespace-nowrap"
            onclick="clearKeywordAndTopics()" title="キーワード検索と探すトピックを解除">解除</button>
          <span id="preset-count" class="text-[10px] text-slate-400"></span>
        </div>
      </div>
      <label class="block text-[10px] font-bold text-slate-600 mb-1">トピックを絞る</label>
      <input id="preset-q" type="search" placeholder="例: ピット　真空　愛知　協力（空白でAND）"
        class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300"
        oninput="onPresetSearch()" />
      <p class="mt-1 text-[10px] text-slate-400">質問文・キーワード・タグから探すトピックだけを絞り込みます</p>
      <div id="presets" class="mt-2 flex flex-wrap gap-1.5 max-h-[48vh] overflow-auto pr-1"></div>
    </section>
  </aside>

  <!-- 中: リスト（地域） -->
  <section class="lg:col-span-5 space-y-3">
    <div class="bg-white rounded-2xl border border-slate-200 p-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-3 flex-wrap">
        <p id="result-count" class="text-xs text-slate-600"></p>
        <button type="button" id="clear-topics-btn"
          class="hidden text-[11px] px-2 py-1 rounded-lg border border-violet-300 bg-violet-100 text-violet-900 font-semibold"
          onclick="clearKeywordAndTopics()">キーワード・探す解除</button>
        <label class="text-xs text-violet-900 flex items-center gap-1.5 cursor-pointer">
          <input id="hq-only" type="checkbox" checked class="rounded border-violet-300 text-violet-700"
            onchange="renderList()" />
          本社のみ（支店・工場を隠す）
        </label>
      </div>
      <select id="sort" class="text-xs border border-slate-200 rounded-lg px-2 py-1" onchange="renderList()">
        <option value="region">地域順</option>
        <option value="name">名前順</option>
        <option value="expand">増強優先</option>
        <option value="detail">詳細あり優先</option>
      </select>
    </div>
    <div id="list" class="space-y-4"></div>
  </section>

  <!-- 右: 詳細 -->
  <section class="lg:col-span-3">
    <div id="detail" class="bg-white rounded-2xl border border-violet-200 p-4 sticky top-20 max-h-[80vh] overflow-auto">
      <p class="text-sm text-slate-400">左のカードを選ぶと詳細が出ます</p>
    </div>
  </section>
  </div>
</main>

<script>
const REGION_ORDER = ['大阪','兵庫','京都・滋賀・奈良','愛知','岐阜','三重','石川・富山','福井','長野','和歌山','静岡','岡山など','その他'];
let territory = null;
let intel = null;
let presets = null;
let equipMap = null;
let crawlAlerts = null;
let byId = {};
let mapByName = {};
let activePresetId = null;
let filter = { query: '', tags: [], region: '', macro: '', position: '' };
let viewMode = 'list'; // list | map
let leafletMap = null;
let markerLayer = null;
const HQ_PLANT_RE = /工場|事業部|営業所|\([^)]+\)/;

function circleIcon(color, size = 14) {
  return L.divIcon({
    className: '',
    html: `<div style="width:${size}px;height:${size}px;border-radius:999px;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
  });
}

function pinColor(row) {
  if (row.has_expansion_alert) return '#b91c1c';
  if (row.relation === 'furnace_maker' || (row.tags || []).includes('炉メーカー')) return '#0369a1';
  if (row.relation === 'coop_partial' || (row.tags || []).includes('一部協業') || (row.tags || []).includes('競合兼協力')) return '#0f766e';
  if (row.relation === 'coop_candidate' || (row.tags || []).includes('協力候補')) return '#047857';
  if (row.relation === 'self' || row.operation === 'self' || (row.tags || []).includes('自社')) return '#1d4ed8';
  if (row.detail_missing) return '#94a3b8';
  return '#6d28d9';
}

function ensureMap() {
  if (leafletMap) return;
  leafletMap = L.map('comp-map', { scrollWheelZoom: false }).setView([35.0, 136.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap',
  }).addTo(leafletMap);
  markerLayer = L.layerGroup().addTo(leafletMap);
  setTimeout(() => leafletMap.invalidateSize(), 80);
}

function renderMap() {
  ensureMap();
  markerLayer.clearLayers();
  const rows = filtered().filter(r => Number.isFinite(r.lat) && Number.isFinite(r.lng));
  const bounds = [];
  rows.forEach(r => {
    const m = L.marker([r.lat, r.lng], { icon: circleIcon(pinColor(r), r.has_expansion_alert ? 16 : 14) });
    m.bindPopup(`<strong>${esc(r.name)}</strong><br>${esc(r.area || '')}<br>${esc((r.blurb || '').slice(0, 80))}`);
    m.on('click', () => showDetail(r.id));
    markerLayer.addLayer(m);
    bounds.push([r.lat, r.lng]);
  });
  document.getElementById('map-meta').textContent =
    `表示 ${rows.length}社（座標あり） / フィルタ ${filtered().length}社`;
  if (bounds.length >= 2) {
    leafletMap.fitBounds(bounds, { padding: [28, 28], maxZoom: 10 });
  } else if (bounds.length === 1) {
    leafletMap.setView(bounds[0], 10);
  }
  setTimeout(() => leafletMap.invalidateSize(), 50);
}

function renderAlerts() {
  const box = document.getElementById('alerts-section');
  const list = document.getElementById('alerts-list');
  if (!crawlAlerts || !(crawlAlerts.alerts || []).length) {
    box.classList.add('hidden');
    document.getElementById('crawl-stat').textContent = crawlAlerts?.updated
      ? `最終クロール ${String(crawlAlerts.updated).slice(0, 16).replace('T', ' ')}`
      : '';
    return;
  }
  const important = (crawlAlerts.alerts || []).filter(a =>
    a.severity === 'critical' || a.severity === 'high' || a.severity === 'medium'
  ).slice(0, 12);
  if (!important.length) {
    box.classList.add('hidden');
    return;
  }
  box.classList.remove('hidden');
  document.getElementById('alerts-meta').textContent =
    `重要 ${crawlAlerts.important_count || important.length} · 更新 ${String(crawlAlerts.updated || '').slice(0, 16).replace('T', ' ')}`;
  document.getElementById('crawl-stat').textContent =
    `アラート ${important.length}`;
  const sevCls = { critical: 'bg-rose-700 text-white', high: 'bg-rose-600 text-white', medium: 'bg-amber-500 text-white' };
  list.innerHTML = important.map(a => {
    const url = (a.urls && (a.urls.company || a.urls.equipment)) || '#';
    return `<div class="flex flex-wrap items-start gap-2 text-xs bg-white/80 border border-rose-100 rounded-lg px-2.5 py-1.5">
      <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${sevCls[a.severity] || 'bg-slate-500 text-white'}">${esc(a.severity)}</span>
      <div class="min-w-0 flex-1">
        <p class="font-semibold text-rose-950">${esc(a.title || a.name)}</p>
        <p class="text-slate-600 mt-0.5">${esc(a.snippet || '')}</p>
      </div>
      <a href="${esc(url)}" target="_blank" rel="noopener" class="text-indigo-700 font-semibold whitespace-nowrap">HP ↗</a>
    </div>`;
  }).join('');
}

/** 検索同義語・誤変換ゆるめ（例: ガス窒化 / 窒化処理） */
const KEYWORD_SYNONYMS = {
  'ガス窒化': ['ガス窒化', '窒化', '窒化処理', '軟窒化'],
  '窒化処理': ['窒化処理', '窒化', 'ガス窒化', '軟窒化', 'イオン窒化', 'プラズマ窒化'],
  '窒化': ['窒化', '窒化処理', 'ガス窒化', '軟窒化', 'イオン窒化', 'プラズマ窒化', '浸炭窒化'],
  '軟窒化': ['軟窒化', 'ガス軟窒化', '窒化', '窒化処理'],
  'イオン窒化': ['イオン窒化', 'プラズマ窒化', '窒化'],
  'プラズマ窒化': ['プラズマ窒化', 'イオン窒化', '窒化'],
  '浸炭': ['浸炭', 'ガス浸炭', '浸炭窒化'],
  '真空': ['真空', '真空炉', '真空熱処理'],
  '高周波': ['高周波', '誘導加熱', '高周波焼入'],
  '協力候補': ['協力候補', '委託先候補', '協力', '相互紹介', '一部協業', '競合兼協力'],
  '委託先候補': ['委託先候補', '協力候補', '委託'],
  '一部協業': ['一部協業', '競合兼協力', '協力候補'],
  '競合兼協力': ['競合兼協力', '一部協業', '協力候補'],
  '炉メーカー': ['炉メーカー', '熱加工装置', '真空溶解炉', 'シンフォニア'],
  'アイコー': ['アイコー', 'AIKO', 'アイコ'],
  'シンフォニア': ['シンフォニア', 'シンフォニアテクノロジー', '神鋼電機', 'Sinfonia'],
  '童話サーモテック': ['童話サーモテック', 'DOWA', 'ドーワ', 'DOWAサーモテック', 'ドーワサーモテック'],
  'DOWA': ['DOWA', 'ドーワ', '童話サーモテック', 'DOWAサーモテック'],
  'リヒトセイコー': ['リヒトセイコー', 'リヒト精光', 'リヒト精工', 'Licht'],
  'リヒト精光': ['リヒト精光', 'リヒトセイコー', 'リヒト精工', 'Licht'],
  'とうけんサーモティック': ['とうけんサーモティック', '東研サーモテック', '東建サーモテック', 'トーケン', '刀剣サーモ'],
  '東研サーモテック': ['東研サーモテック', 'とうけんサーモティック', '東建サーモテック', 'トーケン', '刀剣サーモ'],
  '刀剣サーモ': ['刀剣サーモ', '東研サーモテック', 'とうけんサーモティック', '東建サーモテック'],
  '強烈ヒート': ['強烈ヒート', '共立ヒートテクノ', '共立ヒート', 'きょうりつヒート'],
  '共立ヒート': ['共立ヒート', '共立ヒートテクノ', '強烈ヒート'],
  '橋本': ['橋本', '紀ノ光台', '刀剣サーモ', '東研橋本'],
  '滋賀': ['滋賀', '湖南', '甲賀', '竜王'],
  '京都': ['京都', '京都市', '城陽', '久御山'],
  '豊橋': ['豊橋', '東三河', '豊川', '二川', '明海'],
  '東三河': ['東三河', '豊橋', '豊川', '蒲郡', '田原'],
  '二川熱処理': ['二川熱処理', '二川'],
  'ガス難実家': ['ガス窒化', '窒化', '窒化処理'], // 誤変換救済
  '実家処理': ['窒化処理', '窒化', 'ガス窒化'],
};

function expandToken(token) {
  const t = token.trim().toLowerCase();
  if (!t) return [];
  for (const [k, syns] of Object.entries(KEYWORD_SYNONYMS)) {
    if (k.toLowerCase() === t || syns.some(s => s.toLowerCase() === t)) {
      return syns.map(s => s.toLowerCase());
    }
  }
  return [t];
}

function tokenMatches(blob, token) {
  const alts = expandToken(token);
  return alts.some(a => blob.includes(a));
}

function queryMatches(blob, rawQuery) {
  const q = (rawQuery || '').trim().toLowerCase();
  if (!q) return true;
  // 空白区切りは AND（すべて一致）
  const parts = q.split(/[\s　,、]+/).filter(Boolean);
  if (parts.length <= 1) return tokenMatches(blob, q);
  return parts.every(p => tokenMatches(blob, p));
}

function isHqRow(row) {
  if (row.operation === 'customer' || row.exclude) return false;
  // 自社は常に表示
  if (row.relation === 'self' || row.operation === 'self' || (row.tags || []).includes('自社')) return true;
  if (row.scope === 'company_wide' || row.scope === 'hq') return true;
  // 地域の工場ピンは「本社のみ」でも残す（三重工場・名張など。本社が他県の会社の拠点）
  if (row.scope === 'plant') return true;
  // 営業所だけ隠す
  if (/営業所/.test(row.name || '')) return false;
  return !HQ_PLANT_RE.test(row.name || '');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function homeUrl(c) {
  const sources = (c.sources || []).filter(s => s.url && !s.error);
  const co = sources.find(s => s.kind === 'company') || sources[0];
  return co?.url || '';
}

function findMapRow(name, intelRow) {
  if (!equipMap) return null;
  if (mapByName[name]) return mapByName[name];
  const on = (intelRow?.profile || {}).official_name || '';
  if (on && mapByName[on]) return mapByName[on];
  const short = String(name || '').replace(/株式会社|有限会社|\s+/g, '');
  for (const r of (equipMap.rows || [])) {
    const rk = String(r.key || '');
    const rn = String(r.name || '').replace(/株式会社|有限会社|\s+/g, '');
    if (rk && short.includes(rk)) return r;
    if (rn && (short.includes(rn) || rn.includes(short.slice(0, 6)))) return r;
  }
  return null;
}

function allRows() {
  const comps = territory?.competitor_adjacent_targets || [];
  return comps.map(c => {
    const i = byId[c.id] || {};
    const m = findMapRow(c.name, i);
    const position = m?.position || i.position || '';
    const tags = [...(i.tags || [])];
    if (position && !tags.includes(position)) tags.push(position);
    const equipment_map = m ? {
      carburize: m.carburize, vacuum: m.vacuum, nitride: m.nitride,
      induction: m.induction, aluminum: m.aluminum, anneal: m.anneal,
      max_size: m.max_size, lot: m.lot,
    } : (i.equipment_map || null);
    return {
      ...c, ...i, id: c.id, name: c.name, area: c.area || i.area, note: c.note || i.note || '',
      tags, position, equipment_map,
    };
  });
}

function matches(row) {
  const blob = [
    row.name, row.area, row.note, row.blurb, row.commentary,
    row.equipment_summary, row.scale_summary,
    (row.tags || []).join(' '),
    (row.strategy_notes || []).join(' '),
    (row.equipment || []).map(e => `${e.name} ${e.maker || ''} ${e.spec || ''}`).join(' '),
    row.region_label, row.macro_region, row.operation, row.delegate_to, row.relation,
    (row.aliases || []).join(' '),
    row.detail_missing ? '詳細情報がない 相手にしない' : '',
    row.has_expansion_alert ? '増強' : '',
    row.relation === 'coop_candidate' || row.relation === 'coop_partial' ? '協力候補 委託先候補 協力 委託 一部協業 競合兼協力' : '',
    row.relation === 'furnace_maker' || (row.tags || []).includes('炉メーカー') ? '炉メーカー 熱加工装置 真空溶解炉' : '',
    row.relation === 'self' || row.operation === 'self' ? '自社 オーネックス' : '',
    (row.client_hints || []).length ? '取引先ヒント' : '',
  ].join(' ').toLowerCase();

  if (filter.region && row.region_label !== filter.region) return false;
  if (filter.macro && row.macro_region !== filter.macro) return false;
  if (filter.position && row.position !== filter.position && !(row.tags || []).includes(filter.position)) return false;
  if ((filter.tags || []).length) {
    const tags = new Set(row.tags || []);
    if (!filter.tags.every(t => tags.has(t) || tokenMatches(blob, t))) return false;
  }
  if (!queryMatches(blob, filter.query)) return false;
  return true;
}

function filtered() {
  let rows = allRows().filter(matches);
  if (document.getElementById('hq-only')?.checked) {
    rows = rows.filter(isHqRow);
  }
  const sort = document.getElementById('sort').value;
  rows.sort((a, b) => {
    if (sort === 'expand') {
      const d = (b.has_expansion_alert ? 1 : 0) - (a.has_expansion_alert ? 1 : 0);
      if (d) return d;
    }
    if (sort === 'detail') {
      const d = (a.detail_missing ? 1 : 0) - (b.detail_missing ? 1 : 0);
      if (d) return d;
    }
    if (sort === 'name') return (a.name || '').localeCompare(b.name || '', 'ja');
    const ra = REGION_ORDER.indexOf(a.region_label || 'その他');
    const rb = REGION_ORDER.indexOf(b.region_label || 'その他');
    if (ra !== rb) return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb);
    return (a.name || '').localeCompare(b.name || '', 'ja');
  });
  return rows;
}

function presetMatchesTopicFilter(p, raw) {
  const q = (raw || '').trim().toLowerCase();
  if (!q) return true;
  const blob = [
    p.q, p.query, p.region, p.macro, p.position,
    (p.tags || []).join(' '),
  ].join(' ').toLowerCase();
  const parts = q.split(/[\s　,、]+/).filter(Boolean);
  return parts.every(part => blob.includes(part) || tokenMatches(blob, part));
}

function applyPreset(p, id) {
  viewMode = 'list';
  filter = {
    query: p.query || '',
    tags: p.tags || [],
    region: p.region || '',
    macro: p.macro || '',
    position: p.position || '',
  };
  document.getElementById('q').value = filter.query;
  activePresetId = id || null;
  highlightPresets();
  updateClearBtn();
  renderList();
}

function renderPresets() {
  const qs = presets?.questions || [];
  const topicQ = document.getElementById('preset-q')?.value || '';
  const shown = [];
  qs.forEach((p, idx) => {
    if (presetMatchesTopicFilter(p, topicQ)) shown.push({ p, idx });
  });
  document.getElementById('preset-count').textContent =
    topicQ.trim() ? `${shown.length} / ${qs.length}問` : `${qs.length}問`;
  document.getElementById('presets').innerHTML = shown.length
    ? shown.map(({ p, idx }) => `
    <button type="button" data-id="${esc(p.id)}" data-idx="${idx}"
      class="chip text-[11px] px-2.5 py-1 rounded-full border border-violet-200 bg-violet-50 text-violet-900 hover:bg-violet-100"
      onclick="applyPresetByIdx(${idx})">${esc(p.q)}</button>
  `).join('')
    : '<p class="text-[11px] text-slate-400 py-1">該当トピックなし。キーワードを緩めてください。</p>';
  highlightPresets();
}

    <div class="flex flex-wrap gap-1 mt-2">${(row.tags || []).map(t => `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100">${esc(t)}</span>`).join('')}</div>

    ${expansions.length ? `<div class="mt-3 p-2 rounded-lg border border-rose-300 bg-rose-50">
      <p class="text-xs font-bold text-rose-800 mb-1">増強アラート</p>
      ${expansions.map(a => `<a class="block text-xs text-rose-800 font-semibold mb-1 hover:underline" href="${esc(a.link || '#')}" target="_blank" rel="noopener">${esc(a.title || '')}</a>`).join('')}
    </div>` : ''}

    ${strategy.length ? `<div class="mt-3"><p class="text-xs font-bold text-amber-900 mb-1">HP方針・狙い</p>
      ${strategy.map(s => `<p class="text-xs text-slate-700 mb-1">・${esc(s)}</p>`).join('')}</div>` : ''}

    ${eq.length ? `<div class="mt-3"><p class="text-xs font-bold text-slate-700 mb-1">設備</p>
      <table class="intel-table"><thead><tr><th>設備</th><th>台数</th><th>メーカー</th><th>仕様</th></tr></thead>
      <tbody>${eq.slice(0, 16).map(e => `<tr><td>${esc(e.name)}</td><td>${e.count}基</td><td>${esc(e.maker || '—')}</td><td>${esc(e.spec || '—')}</td></tr>`).join('')}</tbody></table>
      ${row.equipment_summary ? `<p class="text-[11px] text-slate-600 mt-1">${esc(row.equipment_summary)}</p>` : ''}
    </div>` : ''}

    ${hints.length ? `<div class="mt-3"><p class="text-xs font-bold text-rose-800 mb-1">新聞×取引先</p>
      ${hints.slice(0,5).map(h => `<a href="${esc(h.link||'#')}" target="_blank" rel="noopener" class="block text-xs mb-1"><span class="font-bold text-rose-700">${esc(h.name)}</span> ${esc(h.title||'')}</a>`).join('')}
    </div>` : ''}

    ${news.length ? `<div class="mt-3"><p class="text-xs font-bold text-slate-600 mb-1">関連ニュース</p>
      ${news.slice(0,5).map(n => `<a href="${esc(n.link||'#')}" target="_blank" rel="noopener" class="block text-xs text-slate-600 mb-1 ${n.is_expansion ? 'comp-alert-missing' : ''}">${n.is_expansion ? '【増強】' : ''}${esc(n.title||'')}</a>`).join('')}
    </div>` : ''}

    <p class="text-[10px] text-slate-400 mt-4">${row.updated ? '収集: ' + esc(String(row.updated).slice(0,16).replace('T',' ')) : ''} · 客として訪問しない</p>
  `;
}

async function boot() {
  const [tRes, iRes, pRes, mRes, aRes] = await Promise.all([
    fetch('./territory_strategy.json?v=' + Date.now()),
    fetch('./competitor_intel.json?v=' + Date.now()),
    fetch('./competitor_search_presets.json?v=' + Date.now()),
    fetch('./competitor_equipment_map.json?v=' + Date.now()),
    fetch('./competitor_crawl_alerts.json?v=' + Date.now()),
  ]);
  territory = await tRes.json();
  intel = await iRes.json();
  presets = await pRes.json();
  equipMap = await mRes.json().catch(() => null);
  crawlAlerts = await aRes.json().catch(() => null);
  byId = Object.fromEntries((intel.competitors || []).map(c => [c.id, c]));
  mapByName = {};
  for (const r of (equipMap?.rows || [])) {
    if (r.name) mapByName[r.name] = r;
    if (r.key) mapByName[r.key] = r;
  }
  if (!(territory.competitor_adjacent_targets || []).length) {
    const t2 = await fetch('../news/territory_strategy.json?v=' + Date.now()).then(r => r.json()).catch(() => null);
    if (t2) territory = t2;
  }
  const withGeo = (territory.competitor_adjacent_targets || []).filter(c => c.lat && c.lng).length;
  document.getElementById('stat').textContent =
    `${(territory.competitor_adjacent_targets || []).length}社 · 地図ピン ${withGeo}社 · 設備表 ${(equipMap?.rows || []).length}社`;
  renderAlerts();
  renderPresets();
  renderList();
}
boot().catch(e => {
  document.getElementById('list').innerHTML = `<p class="text-sm text-rose-700 p-4">読込失敗: ${esc(e.message)}</p>`;
});
</script>
</body>
</html>
