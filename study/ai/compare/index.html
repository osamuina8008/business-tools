<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商法 · 6AI / 2AI 比較</title>
<style>
:root{font:16px/1.8 -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;color:#172b40;background:#f5f3ed}*{box-sizing:border-box}body{margin:0}header{background:#172b40;color:white;padding:32px max(24px,calc((100vw - 1180px)/2))}header p{color:#c1d0df;font-size:14px}h1{font-size:28px;margin:8px 0}h2{font-size:23px}h3{font-size:18px}h4{font-size:16px}main{max-width:1180px;margin:24px auto;padding:0 24px}button,a.button{font:inherit;border:1px solid #b8c6ce;border-radius:9px;padding:8px 15px;background:#fff;color:#173d59;cursor:pointer;text-decoration:none}button.on{background:#285a65;color:white;border-color:#285a65}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.muted,small{color:#52697a;font-size:13px}.banner{padding:14px 20px;background:#fff0ce;border:1px solid #d9bd7b;border-radius:12px}.card{background:white;border:1px solid #dce2e4;border-radius:15px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid .card{margin:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.85 ui-monospace,monospace;background:#f6f7f8;padding:16px;border-radius:8px}details{border-top:1px solid #e1e7eb;padding:10px 0}summary{cursor:pointer;font-weight:600}p{margin:8px 0}.tag{display:inline-block;background:#e8f3ef;padding:2px 9px;border-radius:20px;font-size:12px;margin-right:5px}.pending{background:#fff0ce}.titleline{display:flex;align-items:center;justify-content:space-between;gap:12px}.markdown p{white-space:pre-wrap}.markdown h3,.markdown h4{margin:18px 0 7px}.empty{color:#835c15}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.status div{background:#f4f6f7;padding:8px;border-radius:7px;font-size:12px}textarea{width:100%;height:90px;font:inherit;border:1px solid #b8c6ce;border-radius:7px;padding:9px}select,input{font:inherit;padding:5px;max-width:100%}label{display:block;margin:10px 0}footer{font-size:12px;color:#52697a;margin:40px 0}#quiz details pre{background:#edf5f1}.warning{border-left:4px solid #c99127;padding:10px 15px;background:#fff7e8}@media(max-width:800px){.grid{grid-template-columns:1fr}.status{grid-template-columns:repeat(2,1fr)}header{padding:24px}main{padding:0 16px}.card{padding:16px}}
</style>
<header><span>2026.11.01 / 商法 / 比較版</span><h1>骨格をつかみ、根拠を確かめる</h1><p>ChatGPTの説明とClaudeの検証を、元の回答に戻れる形で読む</p></header>
<main><div class="banner">本日の保存済み4回答で、従来6 AI版と2 AI版を比べられます。新規の回答生成はしていません。NotebookLMの成果物は確認状況を表示します。</div>
<nav><button id="tanto">短答 6問</button><button id="essay">論文 第6問</button><button id="audit">工程と原資料</button><button id="ab">A/Bを試す</button></nav><div id="qnav"></div><section id="content"></section><footer>本日の保存済み回答を再利用しています。教材画像は追加公開していません。A/Bの好みと標準採用はご自身で選べます。</footer></main>
<script>
let DATA, JOB=0, Q='Q62', MODE='study';
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function markdown(text){const box=el('div',undefined,'markdown');let code=false,buf=[];const flush=()=>{if(buf.length){box.append(el(code?'pre':'p',buf.join('\n')));buf=[]}};for(const line of (text||'').split('\n')){if(line.startsWith('```')){flush();code=!code;continue}if(!code&&/^#{1,6} /.test(line)){flush();box.append(el('h4',line.replace(/^#+ /,'')))}else if(!code&&!line.trim()){flush()}else buf.push(line)}flush();return box}
function detail(title,text){const d=el('details');d.append(el('summary',title),markdown(text));return d}
function card(title){const c=el('section',undefined,'card');c.append(el('h3',title));return c}
function bodyFor(ai){const j=DATA.jobs[JOB];if(j.kind==='論文')return j.answers[ai].body;return j.questions.find(q=>q.id===Q)?.ai[ai]?.body||''}
function secFor(ai){const j=DATA.jobs[JOB];if(j.kind==='論文')return j.answers[ai].sections;const q=j.questions.find(q=>q.id===Q);return Object.entries(q?.ai[ai]?.sections||{}).map(([title,body])=>({title,body}))}
function navigate(job,mode='study'){JOB=job;MODE=mode;render()}
function study(){const job=DATA.jobs[JOB], out=$('content');out.append(el('h2',job.kind==='論文'?'論文 第6問 · 株式譲渡の自由とその制限':`短答 ${Q}`));const s=secFor('ChatGPT');const skeleton=job.kind==='論文'?s.find(v=>v.title.includes('骨格')):s.find(v=>v.title.includes('図解'));const first=card('ひと目の骨格');first.append(markdown(skeleton?.body||s.find(v=>v.title.includes('何を聞いている'))?.body||'この回答では骨格を取得できていません'));out.append(first);
const caution=card('独自の指摘・食い違いを確認する');caution.append(el('p','一致していることだけでは正確さは確定しません。出典ごとの指摘を残し、判断を勝手に統合しません。','muted'));if(job.kind==='論文'){caution.append(el('p','要確認：ChatGPTは単元未満株式を「旧制度」と区別し、Claudeは189条3項を現行の論点として列挙しています。両回答に記述の差があります。','warning'))}else{const q=job.questions.find(q=>q.id===Q),a=q?.ai.ChatGPT?.answer,b=q?.ai.Claude?.answer;caution.append(el('p',a&&b?`正解の記載：ChatGPT ${a} / Claude ${b} ${(a.match(/^\d+/)||[])[0]===(b.match(/^\d+/)||[])[0]?'（正解番号は一致）':'（不一致・要確認）'}`:'正解の記載は要確認'))}for(const ai of ['ChatGPT','Claude']){const ss=secFor(ai), text=ss.filter(v=>/要確認|規範カード|迷い|補足|条文|判例/.test(v.title)).map(v=>`## ${v.title}\n${v.body}`).join('\n\n');caution.append(detail(ai+'の指摘を読む',text||bodyFor(ai)))}out.append(caution);
const grid=el('div',undefined,'grid');for(const ai of ['ChatGPT','Claude']){const c=card(ai==='ChatGPT'?'ChatGPT · 説明と骨格':'Claude · 根拠と点検');c.append(el('span','保存済み・取込済み','tag'));for(const sec of secFor(ai)){if(/思い出しテスト|リトリーバル/.test(sec.title))continue;c.append(detail(sec.title,sec.body))}c.append(detail('原回答の全文',bodyFor(ai)));grid.append(c)}out.append(grid);
const quiz=card('何も見ずに思い出す');quiz.id='quiz';if(job.kind==='論文'){for(const item of job.answers.ChatGPT.recall){quiz.append(el('h4',item.title),el('p',item.question),detail('答えと根拠を開く',item.answer))}}else{quiz.append(el('p',`${Q}の結論と、その判断を分ける言葉を説明してください。`));for(const ai of ['ChatGPT','Claude']){const refs=secFor(ai).filter(v=>/結論|次回の解き方/.test(v.title));quiz.append(detail(ai+'の回答を確認',refs.map(v=>v.body).join('\n\n')))}}quiz.append(el('p','答えは保存済み回答から引用しています。','muted'));out.append(quiz);
const media=card('NotebookLM · 聞く・図で見る');media.append(el('p','完成した成果物のURLが未取得のため、再生ボタンはまだありません。','empty'));for(const m of DATA.media.items)media.append(el('p',`${m.type} ${m.expected}${m.type==='短い動画'?'本':'点'} · 完成/保存/リンク未確認`));media.append(el('p','この実行全体の上限です。短答・論文で倍増させず、既存成果物を照合してから使います。','muted'));out.append(media);const refs=card('原資料');addMaterials(refs,job);out.append(refs)}
function addMaterials(c,job){job.answers.ChatGPT.materials.forEach((m,i)=>{const p=el('p'),a=el('a',`${m.role} · ${m.name}`);a.href=m.url||'#';if(!m.url){a.removeAttribute('href');a.textContent+='（Macの原資料から確認）'}a.target='_blank';a.rel='noopener';p.append(a);c.append(p)})}
function audit(){const out=$('content'),j=DATA.jobs[JOB];out.append(el('h2',j.kind+' '+j.qid+' · 工程の証拠'));for(const ai of ['ChatGPT','Claude']){const a=j.answers[ai],c=card(ai),grid=el('div',undefined,'status');for(const[k,v]of Object.entries(a.stages))grid.append(el('div',k+'\n'+v));c.append(grid,el('p',`保存本文：${a.bytes.toLocaleString()} bytes / 更新 ${a.modified}`,'muted'),el('p',a.validation_error?'検証エラー：'+a.validation_error:'旧検証規則を通過。新しい論文見出しは全文を保持。','muted'),detail('入力・保存先・ハッシュ',JSON.stringify({input_sha256:a.input_sha256,prompt_sha256:a.prompt_sha256,answer_sha256:a.sha256,path:a.path,collected_ids:a.collected_ids},null,2)));out.append(c)}const c=card('原資料への入口');addMaterials(c,j);out.append(c);const d=card('公開の状態');d.append(el('p',DATA.public.status+'。'+DATA.public.reason));const a=el('a','失敗したGitHub Pages処理');a.href=DATA.public.failed_run;a.target='_blank';d.append(a);out.append(d)}
function ab(){const c=card('標準は変えず、A/Bを選ぶ');c.append(el('p','Aは従来の6 AI画面、Bはこの2 AI画面です。新たな学習法の採用は、選択を受けてから検討します。'));const a=el('a','A · 従来の画面を開く','button');a.href='https://osamuina8008.github.io/business-tools/study/ai/';a.target='_blank';c.append(a,el('p','比較時は同程度の問題・同じ学習時間で、翌日に想起・理由説明・当てはめを確認します。現在のBは表示の試用であり、改善効果は未検証です。','muted'));for(const[id,label,options]of [['preference','使いやすさの好み',['未選択','A 従来','B 2 AI']],['recall','翌日の想起',['未測定','0 再現できない','1 一部','2 再現できる']],['reason','翌日の理由説明',['未測定','0 説明できない','1 一部','2 説明できる']],['apply','翌日の当てはめ',['未測定','0 結べない','1 一部','2 事実と規範を結べる']]]){const l=el('label',label+' '),s=el('select');s.id=id;options.forEach(t=>s.append(el('option',t)));l.append(s);c.append(l)}const l=el('label','問題・学習時間・メモ（好みと成果を分けて記録）'),t=el('textarea');t.id='memo';l.append(t);c.append(l);const save=el('button','この端末に試用結果を保存');save.onclick=()=>{const r={date:new Date().toISOString(),kind:DATA.jobs[JOB].kind,qid:Q};['preference','recall','reason','apply','memo'].forEach(id=>r[id]=$(id).value);localStorage.setItem('core_ab_'+DATA.jobs[JOB].id+'_'+Q,JSON.stringify(r));$('saved').textContent='この端末に保存しました。標準の切替・外部への送信は行いません。'};c.append(save,el('p','','muted'));c.lastChild.id='saved';$('content').append(c)}
function render(){const j=DATA.jobs[JOB];$('content').replaceChildren();$('qnav').replaceChildren();$('tanto').classList.toggle('on',JOB===0);$('essay').classList.toggle('on',JOB===1);if(MODE==='study'&&j.kind==='短答'){const nav=el('nav');j.questions.forEach(q=>{const b=el('button',q.id+(q.available?'':' 資料なし'));b.classList.toggle('on',q.id===Q);b.disabled=!q.available;b.onclick=()=>{Q=q.id;render()};nav.append(b)});$('qnav').append(nav)}if(MODE==='audit')audit();else if(MODE==='ab')ab();else study()}
$('tanto').onclick=()=>navigate(0);$('essay').onclick=()=>navigate(1);$('audit').onclick=()=>{MODE='audit';render()};$('ab').onclick=()=>{MODE='ab';render()};fetch('snapshot.json').then(r=>r.json()).then(d=>{DATA=d;render()}).catch(e=>{$('content').textContent='データを読み込めませんでした。'+e.message});
</script></html>
