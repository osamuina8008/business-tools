<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ビジネスメール作成ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    textarea { resize: vertical; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    #output-text { white-space: pre-wrap; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="../index.html" class="text-gray-400 hover:text-gray-600 text-sm">← ツール一覧</a>
      <span class="text-gray-300">|</span>
      <h1 class="text-lg font-bold text-gray-800">ビジネスメール作成</h1>
      <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium">無料</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- INPUT -->
    <div class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">INPUT</span>
        <span class="text-sm font-semibold text-gray-700">メール情報を入力</span>
      </div>

      <!-- 自分の情報 -->
      <div class="mb-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
        <p class="text-xs font-semibold text-gray-500 mb-2">差出人（自分）</p>
        <div class="grid grid-cols-2 gap-2">
          <input id="my-name" type="text" placeholder="氏名（例: 稲垣 理）"
            class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white"
            oninput="saveSettings()" />
          <input id="my-company" type="text" placeholder="会社名（例: ワンエクス）"
            class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white"
            oninput="saveSettings()" />
          <input id="my-dept" type="text" placeholder="部署（省略可）"
            class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white col-span-2"
            oninput="saveSettings()" />
        </div>
        <p class="text-xs text-gray-400 mt-1.5">※入力内容は自動保存されます</p>
      </div>

      <!-- メール種別 -->
      <div class="mb-4">
        <label class="text-sm font-semibold text-gray-700 block mb-2">メール種別</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="selectType(this,'アポ依頼')" data-type="アポ依頼"
            class="type-btn border-2 border-blue-500 bg-blue-50 text-blue-700 text-sm font-semibold rounded-xl py-2 transition hover:bg-blue-100">
            アポ依頼
          </button>
          <button onclick="selectType(this,'返信')" data-type="返信"
            class="type-btn border-2 border-gray-200 bg-white text-gray-600 text-sm font-semibold rounded-xl py-2 transition hover:bg-gray-50">
            返信
          </button>
          <button onclick="selectType(this,'お礼')" data-type="お礼"
            class="type-btn border-2 border-gray-200 bg-white text-gray-600 text-sm font-semibold rounded-xl py-2 transition hover:bg-gray-50">
            お礼
          </button>
          <button onclick="selectType(this,'問い合わせ')" data-type="問い合わせ"
            class="type-btn border-2 border-gray-200 bg-white text-gray-600 text-sm font-semibold rounded-xl py-2 transition hover:bg-gray-50">
            問い合わせ
          </button>
          <button onclick="selectType(this,'フォロー')" data-type="フォロー"
            class="type-btn border-2 border-gray-200 bg-white text-gray-600 text-sm font-semibold rounded-xl py-2 transition hover:bg-gray-50">
            フォロー
          </button>
          <button onclick="selectType(this,'お断り')" data-type="お断り"
            class="type-btn border-2 border-gray-200 bg-white text-gray-600 text-sm font-semibold rounded-xl py-2 transition hover:bg-gray-50">
            お断り
          </button>
        </div>
      </div>

      <!-- 相手の情報 -->
      <div class="mb-4">
        <label class="text-sm font-semibold text-gray-700 block mb-2">相手の情報（省略可）</label>
        <div class="grid grid-cols-2 gap-2">
          <input id="to-company" type="text" placeholder="相手の会社名"
            class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
          <input id="to-name" type="text" placeholder="氏名（例: 田中様）"
            class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
        </div>
      </div>

      <!-- 伝えたいポイント -->
      <div class="mb-4">
        <label class="text-sm font-semibold text-gray-700 block mb-1">
          伝えたいポイント <span class="text-red-400">*</span>
          <span class="text-gray-400 font-normal text-xs ml-1">（箇条書きでOK）</span>
        </label>
        <textarea id="points" rows="6" placeholder="例：
・先日の展示会でお会いした
・新製品の加工精度について詳しく説明したい
・来週〜再来週で30分ほど時間がほしい
・オンラインでも対面でも可"
          class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
      </div>

      <!-- 件名ヒント -->
      <div class="mb-4">
        <label class="text-sm font-semibold text-gray-700 block mb-1">件名のヒント（省略可）</label>
        <input id="subject-hint" type="text" placeholder="例: 新製品のご案内"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>

      <!-- 文体 -->
      <div class="mb-5">
        <label class="text-sm font-semibold text-gray-700 block mb-2">文体</label>
        <div class="flex gap-4 text-sm">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="radio" name="tone" value="formal" class="accent-blue-500" /> フォーマル
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="radio" name="tone" value="standard" checked class="accent-blue-500" /> 標準
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="radio" name="tone" value="casual" class="accent-blue-500" /> 柔らかめ
          </label>
        </div>
      </div>

      <button onclick="generateEmail()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        メールを生成する
      </button>
    </div>

    <!-- OUTPUT -->
    <div class="flex flex-col gap-4">
      <div id="output-area" class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm min-h-[400px] flex flex-col">
        <div class="flex items-center gap-2 mb-4">
          <span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-0.5 rounded">OUTPUT</span>
          <span class="text-sm font-semibold text-gray-700">生成されたメール</span>
        </div>

        <!-- Placeholder -->
        <div id="placeholder" class="flex-1 flex flex-col items-center justify-center text-gray-300">
          <svg class="w-16 h-16 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <p class="text-sm">ポイントを入力して生成ボタンを押してください</p>
        </div>

        <!-- Result -->
        <div id="result" class="hidden fade-in flex-1 flex flex-col">
          <!-- Subject -->
          <div class="mb-3">
            <p class="text-xs font-semibold text-gray-500 mb-1">件名</p>
            <div class="flex items-center gap-2">
              <p id="subject-output" class="flex-1 text-sm font-semibold text-gray-800 bg-gray-50 rounded-lg px-3 py-2 border border-gray-100"></p>
              <button onclick="copySubject()" class="text-xs text-gray-500 hover:text-blue-600 border border-gray-200 rounded-lg px-2 py-1.5 hover:bg-blue-50 transition whitespace-nowrap">
                コピー
              </button>
            </div>
          </div>
          <!-- Body -->
          <div class="flex-1 flex flex-col">
            <p class="text-xs font-semibold text-gray-500 mb-1">本文</p>
            <div id="output-text" class="flex-1 text-sm text-gray-800 bg-gray-50 rounded-xl px-4 py-3 border border-gray-100 leading-7 min-h-[200px]"></div>
          </div>
          <!-- Actions -->
          <div class="flex gap-2 mt-3">
            <button onclick="copyAll()" class="flex-1 border border-gray-200 hover:bg-gray-50 text-gray-700 text-sm font-medium py-2.5 rounded-xl transition flex items-center justify-center gap-1.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
              全文コピー
            </button>
            <button onclick="openGmail()" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 text-sm font-medium py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 border border-red-100">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              Gmailで開く
            </button>
          </div>
        </div>
      </div>

      <!-- Tips -->
      <div class="bg-blue-50 rounded-2xl border border-blue-100 p-4">
        <p class="text-xs font-semibold text-blue-700 mb-2">ポイント入力のコツ</p>
        <ul class="text-xs text-blue-600 space-y-1">
          <li>・「・」や「-」で箇条書きにすると精度UP</li>
          <li>・日時や場所など具体的な情報を入れると◎</li>
          <li>・相手との関係性（初面/既知）も書くと自然な文章に</li>
          <li>・長さは3〜7項目が最適</li>
        </ul>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-sm px-4 py-2.5 rounded-xl opacity-0 transition-opacity pointer-events-none z-50 flex items-center gap-2">
    <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    <span id="toast-msg">コピーしました</span>
  </div>

<script>
let currentType = 'アポ依頼';
let generatedSubject = '';
let generatedBody = '';

// ---- Settings ----
function saveSettings() {
  localStorage.setItem('bt_myname', document.getElementById('my-name').value);
  localStorage.setItem('bt_mycompany', document.getElementById('my-company').value);
  localStorage.setItem('bt_mydept', document.getElementById('my-dept').value);
}
function loadSettings() {
  document.getElementById('my-name').value = localStorage.getItem('bt_myname') || '稲垣 理';
  document.getElementById('my-company').value = localStorage.getItem('bt_mycompany') || 'ワンエクス';
  document.getElementById('my-dept').value = localStorage.getItem('bt_mydept') || '';
}
window.addEventListener('load', loadSettings);

// ---- Type select ----
function selectType(btn, type) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(b => {
    b.classList.remove('border-blue-500','bg-blue-50','text-blue-700');
    b.classList.add('border-gray-200','bg-white','text-gray-600');
  });
  btn.classList.add('border-blue-500','bg-blue-50','text-blue-700');
  btn.classList.remove('border-gray-200','bg-white','text-gray-600');
}

// ---- Parse bullet points ----
function parseBullets(text) {
  return text.split('\n')
    .map(l => l.replace(/^[\s・\-\*•]+/, '').trim())
    .filter(l => l.length > 0);
}

// ---- Signature ----
function buildSignature() {
  const name = document.getElementById('my-name').value.trim() || '稲垣 理';
  const company = document.getElementById('my-company').value.trim() || '';
  const dept = document.getElementById('my-dept').value.trim() || '';
  let sig = '──────────────────\n';
  sig += name + '\n';
  if (dept) sig += dept + '\n';
  if (company) sig += company + '\n';
  return sig;
}

// ---- Greeting based on tone ----
function getGreeting(tone) {
  if (tone === 'formal') return 'いつも大変お世話になっております。';
  if (tone === 'casual') return 'いつもお世話になっております。';
  return 'お世話になっております。';
}

function getOpening(tone, myName, myCompany) {
  const company = myCompany ? myCompany + 'の' : '';
  return `${company}${myName}でございます。`;
}

// ---- Template generator ----
function buildEmail(type, bullets, tone, toName, toCompany, subjectHint) {
  const myName = document.getElementById('my-name').value.trim() || '稲垣 理';
  const myCompany = document.getElementById('my-company').value.trim() || '';
  const greeting = getGreeting(tone);
  const opening = getOpening(tone, myName, myCompany);

  // Recipient line
  let recipient = '';
  if (toCompany && toName) recipient = `${toCompany}\n${toName}様`;
  else if (toName) recipient = `${toName}様`;
  else if (toCompany) recipient = `${toCompany}\nご担当者様`;
  else recipient = 'ご担当者様';

  // Build bullet block
  const bulletBlock = bullets.map(b => `・${b}`).join('\n');

  let subject = '';
  let body = '';

  if (type === 'アポ依頼') {
    subject = subjectHint || 'お打ち合わせのお願い';
    body = `${recipient}

${greeting}
${opening}

突然のご連絡、失礼いたします。

この度は、以下の件についてご相談させていただきたく、ご連絡申し上げました。

${bulletBlock}

ご多忙の折、誠に恐縮ではございますが、ぜひ一度お時間をいただけますでしょうか。

ご都合の良い日時をいくつかご提示いただけますと幸いです。

どうぞよろしくお願い申し上げます。

${buildSignature()}`;
  }

  else if (type === '返信') {
    subject = subjectHint ? `Re: ${subjectHint}` : 'Re: ご連絡の件';
    body = `${recipient}

${greeting}
${opening}

ご連絡いただきありがとうございます。

以下の通りご回答申し上げます。

${bulletBlock}

ご不明な点がございましたら、お気軽にお問い合わせください。

引き続きどうぞよろしくお願い申し上げます。

${buildSignature()}`;
  }

  else if (type === 'お礼') {
    subject = subjectHint || '先日はありがとうございました';
    body = `${recipient}

${greeting}
${opening}

先日はお時間をいただき、誠にありがとうございました。

${bulletBlock}

今後ともどうぞよろしくお願い申し上げます。

${buildSignature()}`;
  }

  else if (type === '問い合わせ') {
    subject = subjectHint || 'お問い合わせの件';
    body = `${recipient}

${greeting}
${opening}

突然のご連絡、失礼いたします。

以下の点についてお伺いしたく、ご連絡申し上げました。

${bulletBlock}

ご確認の上、ご回答いただけますと幸いです。

お手数をおかけしますが、どうぞよろしくお願い申し上げます。

${buildSignature()}`;
  }

  else if (type === 'フォロー') {
    subject = subjectHint ? `フォロー: ${subjectHint}` : '先日のご提案について';
    body = `${recipient}

${greeting}
${opening}

先日はお時間をいただきありがとうございました。

その後のご状況はいかがでしょうか。

${bulletBlock}

引き続きご検討いただけますと幸いです。
ご不明な点がございましたら、お気軽にご連絡ください。

どうぞよろしくお願い申し上げます。

${buildSignature()}`;
  }

  else if (type === 'お断り') {
    subject = subjectHint ? `Re: ${subjectHint}` : 'ご提案の件について';
    body = `${recipient}

${greeting}
${opening}

この度はご提案いただき、誠にありがとうございました。

社内で慎重に検討いたしましたが、以下の理由により、今回はご辞退させていただくこととなりました。

${bulletBlock}

せっかくのご提案にお応えできず、大変申し訳ございません。
またの機会にご縁がございましたら、何卒よろしくお願い申し上げます。

${buildSignature()}`;
  }

  return { subject, body: body.trim() };
}

// ---- Generate ----
function generateEmail() {
  const pointsText = document.getElementById('points').value.trim();
  if (!pointsText) {
    alert('伝えたいポイントを入力してください。');
    return;
  }

  const bullets = parseBullets(pointsText);
  const tone = document.querySelector('input[name="tone"]:checked').value;
  const toName = document.getElementById('to-name').value.trim();
  const toCompany = document.getElementById('to-company').value.trim();
  const subjectHint = document.getElementById('subject-hint').value.trim();

  const { subject, body } = buildEmail(currentType, bullets, tone, toName, toCompany, subjectHint);

  generatedSubject = subject;
  generatedBody = body;

  document.getElementById('subject-output').textContent = subject;
  document.getElementById('output-text').textContent = body;
  document.getElementById('placeholder').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
}

// ---- Copy ----
function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  toast.style.opacity = '1';
  setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}
function copySubject() {
  navigator.clipboard.writeText(generatedSubject).then(() => showToast('件名をコピーしました'));
}
function copyAll() {
  const all = `件名: ${generatedSubject}\n\n${generatedBody}`;
  navigator.clipboard.writeText(all).then(() => showToast('全文コピーしました'));
}
function openGmail() {
  const subject = encodeURIComponent(generatedSubject);
  const body = encodeURIComponent(generatedBody);
  window.open(`https://mail.google.com/mail/?view=cm&fs=1&su=${subject}&body=${body}`, '_blank');
}
</script>
</body>
</html>
