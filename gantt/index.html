<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>製造ガントチャート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }

    /* ガントチャート テーブル */
    .gantt-wrap { overflow-x: auto; }
    .gantt-table { border-collapse: collapse; min-width: 100%; }
    .gantt-table th, .gantt-table td {
      border: 1px solid #e5e7eb;
      font-size: 11px;
      white-space: nowrap;
    }
    .gantt-table th { background: #f9fafb; padding: 4px 6px; text-align: center; }
    .gantt-table td { padding: 2px 4px; }
    .gantt-label { min-width: 140px; max-width: 180px; position: sticky; left: 0; background: #fff; z-index: 1; }
    .gantt-label-header { min-width: 140px; position: sticky; left: 0; background: #f9fafb; z-index: 2; }
    .day-col { width: 28px; min-width: 28px; text-align: center; }
    .today-col { background: #fef9c3 !important; }

    /* ガントバー */
    .bar { height: 18px; border-radius: 3px; opacity: 0.85; }
    .bar-done        { background: #6b7280; }
    .bar-in_progress { background: #3b82f6; }
    .bar-pending     { background: #d1d5db; border: 1px dashed #9ca3af; }

    /* フェード */
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

    /* モーダル背景 */
    .modal-bg { background: rgba(0,0,0,0.4); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-gray-200 sticky top-0 z-20">
  <div class="max-w-full px-4 py-3 flex items-center gap-3 flex-wrap">
    <a href="../index.html" class="text-gray-400 hover:text-gray-600 text-sm">← ツール一覧</a>
    <span class="text-gray-300">|</span>
    <h1 class="text-lg font-bold text-gray-800">製造ガントチャート</h1>
    <div class="ml-auto flex items-center gap-2">
      <button onclick="openSettings()"
        class="text-xs text-gray-500 hover:text-gray-700 border border-gray-200 rounded-lg px-2 py-1">
        ⚙ GAS設定
      </button>
      <button onclick="loadFromGAS()"
        class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-lg px-3 py-1 font-bold">
        ↻ 同期
      </button>
    </div>
  </div>
</header>

<!-- 顧客タブバー -->
<div class="bg-white border-b border-gray-200 px-4 py-2 flex items-center gap-2 overflow-x-auto">
  <span class="text-xs text-gray-500 font-semibold shrink-0">顧客:</span>
  <div id="customer-tabs" class="flex gap-2 flex-wrap"></div>
  <button onclick="openAddCustomer()"
    class="shrink-0 text-xs border border-dashed border-gray-300 hover:border-blue-400 text-gray-400 hover:text-blue-600 rounded-lg px-3 py-1.5 transition">
    ＋ 顧客追加
  </button>
</div>

<!-- メインコンテンツ -->
<main class="px-4 py-4 max-w-full">

  <!-- 凡例 + 表示期間 -->
  <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
    <div class="flex items-center gap-3 text-xs text-gray-500">
      <span class="flex items-center gap-1"><span class="w-4 h-3 rounded bg-gray-400 inline-block"></span>完了</span>
      <span class="flex items-center gap-1"><span class="w-4 h-3 rounded bg-blue-500 inline-block"></span>進行中</span>
      <span class="flex items-center gap-1"><span class="w-4 h-3 rounded bg-gray-200 border border-dashed border-gray-400 inline-block"></span>予定</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="shiftWeeks(-2)" class="text-xs border border-gray-200 rounded px-2 py-1 hover:bg-gray-100">◀ 2週前</button>
      <button onclick="goToday()" class="text-xs bg-blue-50 text-blue-700 border border-blue-200 rounded px-2 py-1 font-bold">今日</button>
      <button onclick="shiftWeeks(2)" class="text-xs border border-gray-200 rounded px-2 py-1 hover:bg-gray-100">2週後 ▶</button>
    </div>
  </div>

  <!-- ガントチャートエリア -->
  <div id="gantt-area" class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
    <div class="text-sm text-gray-400 text-center py-12" id="gantt-placeholder">
      右上の「GAS設定」でスプレッドシートのURLを設定してください
    </div>
  </div>

  <!-- タスク追加ボタン -->
  <div class="mt-3 flex justify-end">
    <button onclick="openAddTask()"
      class="bg-purple-600 hover:bg-purple-700 text-white font-bold text-sm px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      工程追加
    </button>
  </div>

</main>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-sm px-4 py-2.5 rounded-xl opacity-0 transition-opacity pointer-events-none z-50">
  <span id="toast-msg"></span>
</div>

<!-- ===== GAS設定モーダル ===== -->
<div id="modal-settings" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-bg p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 fade-in">
    <h2 class="text-base font-bold text-gray-800 mb-4">⚙ GAS設定</h2>
    <p class="text-xs text-gray-500 mb-3">
      Google スプレッドシートに紐づくApps ScriptのデプロイURLを入力してください。<br>
      <code class="bg-gray-100 px-1 rounded">gas/gantt-sync.gs</code> を使ってください。
    </p>
    <div class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">GAS Web App URL</label>
        <input id="gas-url-input" type="url" placeholder="https://script.google.com/macros/s/.../exec"
          class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      <button onclick="testGASConnection()"
        class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 rounded-xl text-sm border border-blue-200 transition">接続テスト</button>
      <button onclick="saveSettings()"
        class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-xl text-sm transition">保存</button>
      <button onclick="closeModal('modal-settings')"
        class="px-4 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 rounded-xl text-sm transition">閉じる</button>
    </div>
    <div id="gas-test-result" class="mt-3 text-xs"></div>
  </div>
</div>

<!-- ===== 顧客追加モーダル ===== -->
<div id="modal-add-customer" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-bg p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 fade-in">
    <h2 class="text-base font-bold text-gray-800 mb-4">顧客追加</h2>
    <div>
      <label class="text-xs font-semibold text-gray-600 block mb-1">顧客名 <span class="text-red-400">*</span></label>
      <input id="new-customer-name" type="text" placeholder="例: 株式会社〇〇"
        class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
    </div>
    <div class="flex gap-2 mt-5">
      <button onclick="addCustomer()"
        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-sm transition">追加</button>
      <button onclick="closeModal('modal-add-customer')"
        class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 rounded-xl text-sm transition">キャンセル</button>
    </div>
  </div>
</div>

<!-- ===== 工程追加モーダル ===== -->
<div id="modal-add-task" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-bg p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 fade-in">
    <h2 class="text-base font-bold text-gray-800 mb-4">工程追加</h2>
    <div class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">顧客</label>
        <select id="task-customer" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300 bg-white"></select>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">工程名 <span class="text-red-400">*</span></label>
        <input id="task-name" type="text" placeholder="例: 機械加工・表面処理・検査"
          class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">開始日 <span class="text-red-400">*</span></label>
          <input id="task-start" type="date" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">終了日 <span class="text-red-400">*</span></label>
          <input id="task-end" type="date" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">ステータス</label>
        <select id="task-status" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300 bg-white">
          <option value="pending">予定</option>
          <option value="in_progress">進行中</option>
          <option value="done">完了</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">メモ</label>
        <input id="task-memo" type="text" placeholder="材料・備考など"
          class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      <button onclick="addTask()"
        class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-xl text-sm transition">追加</button>
      <button onclick="closeModal('modal-add-task')"
        class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 rounded-xl text-sm transition">キャンセル</button>
    </div>
  </div>
</div>

<!-- ===== 工程編集モーダル ===== -->
<div id="modal-edit-task" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-bg p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 fade-in">
    <h2 class="text-base font-bold text-gray-800 mb-4">工程編集</h2>
    <input type="hidden" id="edit-task-id" />
    <div class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">工程名</label>
        <input id="edit-task-name" type="text"
          class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">開始日</label>
          <input id="edit-task-start" type="date" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">終了日</label>
          <input id="edit-task-end" type="date" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">ステータス</label>
        <select id="edit-task-status" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300 bg-white">
          <option value="pending">予定</option>
          <option value="in_progress">進行中</option>
          <option value="done">完了</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">メモ</label>
        <input id="edit-task-memo" type="text"
          class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" />
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      <button onclick="saveEditTask()"
        class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-xl text-sm transition">保存</button>
      <button onclick="deleteTaskById(document.getElementById('edit-task-id').value)"
        class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 rounded-xl text-sm transition border border-red-200">削除</button>
      <button onclick="closeModal('modal-edit-task')"
        class="px-4 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 rounded-xl text-sm transition">閉じる</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 状態
// ============================================================
let customers = [];
let tasks     = [];
let selectedCustomerId = null;
let viewStartDate = getMonday(new Date()); // 今週月曜
const VIEW_DAYS = 56; // 8週間表示

// ============================================================
// 起動
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('task-start').value = today;
  document.getElementById('task-end').value   = today;
  loadLocal();
  renderCustomerTabs();
  renderGantt();
  const gasUrl = localStorage.getItem('bt_gantt_gas_url');
  if (gasUrl) loadFromGAS();
});

// ============================================================
// ローカルストレージ
// ============================================================
function loadLocal() {
  customers = JSON.parse(localStorage.getItem('bt_gantt_customers') || '[]');
  tasks     = JSON.parse(localStorage.getItem('bt_gantt_tasks')     || '[]');
  if (customers.length === 0) {
    customers = [
      { id:1, name:'ジェイテクト', color:'#3B82F6' },
      { id:2, name:'ヤンマー',     color:'#10B981' },
      { id:3, name:'大和歯車',     color:'#F59E0B' },
      { id:4, name:'大島精密',     color:'#EF4444' },
      { id:5, name:'前田鐵工所',   color:'#8B5CF6' },
    ];
    saveLocal();
  }
  if (selectedCustomerId === null && customers.length > 0) {
    selectedCustomerId = customers[0].id;
  }
}
function saveLocal() {
  localStorage.setItem('bt_gantt_customers', JSON.stringify(customers));
  localStorage.setItem('bt_gantt_tasks',     JSON.stringify(tasks));
}

// ============================================================
// GAS同期
// ============================================================
async function loadFromGAS() {
  const url = localStorage.getItem('bt_gantt_gas_url');
  if (!url) { openSettings(); return; }
  showToast('同期中...');
  try {
    const res  = await fetch(url + '?action=getAll');
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    customers = data.customers.map(c => ({ id: Number(c.id), name: c.name, color: c.color }));
    tasks     = data.tasks.map(t => ({
      id:          Number(t.id),
      customer_id: Number(t.customer_id),
      item_name:   t.item_name,
      start_date:  t.start_date,
      end_date:    t.end_date,
      status:      t.status,
      memo:        t.memo || '',
    }));
    if (selectedCustomerId === null && customers.length > 0) selectedCustomerId = customers[0].id;
    saveLocal();
    renderCustomerTabs();
    renderGantt();
    showToast('同期完了！');
  } catch (e) {
    showToast('同期エラー: ' + e.message);
  }
}

async function callGAS(params) {
  const url = localStorage.getItem('bt_gantt_gas_url');
  if (!url) return null;
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(url + '?' + qs);
  return await res.json();
}

// ============================================================
// 設定
// ============================================================
function openSettings() {
  document.getElementById('gas-url-input').value = localStorage.getItem('bt_gantt_gas_url') || '';
  document.getElementById('gas-test-result').textContent = '';
  document.getElementById('modal-settings').classList.remove('hidden');
}
function saveSettings() {
  const url = document.getElementById('gas-url-input').value.trim();
  localStorage.setItem('bt_gantt_gas_url', url);
  closeModal('modal-settings');
  showToast('設定を保存しました');
  if (url) loadFromGAS();
}
async function testGASConnection() {
  const url = document.getElementById('gas-url-input').value.trim();
  const el  = document.getElementById('gas-test-result');
  if (!url) { el.textContent = 'URLを入力してください'; el.className = 'mt-3 text-xs text-red-500'; return; }
  el.textContent = '接続テスト中...'; el.className = 'mt-3 text-xs text-gray-400';
  try {
    const res  = await fetch(url + '?action=getAll');
    const data = await res.json();
    if (data.status === 'ok') {
      el.textContent = `✅ 接続OK（顧客:${data.customers.length}件・工程:${data.tasks.length}件）`;
      el.className = 'mt-3 text-xs text-green-600';
    } else {
      throw new Error(data.message);
    }
  } catch (e) {
    el.textContent = '❌ エラー: ' + e.message;
    el.className = 'mt-3 text-xs text-red-500';
  }
}

// ============================================================
// 顧客タブ
// ============================================================
function renderCustomerTabs() {
  const wrap = document.getElementById('customer-tabs');
  wrap.innerHTML = customers.map(c => {
    const active = c.id === selectedCustomerId;
    const bg     = active ? c.color : '#f3f4f6';
    const text   = active ? '#fff'   : '#374151';
    const border = active ? c.color  : '#e5e7eb';
    return `<button onclick="selectCustomer(${c.id})"
      style="background:${bg};color:${text};border-color:${border}"
      class="text-xs font-bold px-3 py-1.5 rounded-lg border transition shrink-0">
      ${escHtml(c.name)}
    </button>`;
  }).join('');
}
function selectCustomer(id) {
  selectedCustomerId = id;
  renderCustomerTabs();
  renderGantt();
}

// ============================================================
// 顧客追加
// ============================================================
function openAddCustomer() {
  document.getElementById('new-customer-name').value = '';
  document.getElementById('modal-add-customer').classList.remove('hidden');
}
async function addCustomer() {
  const name = document.getElementById('new-customer-name').value.trim();
  if (!name) { showToast('顧客名を入力してください'); return; }

  const colors = ['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316'];
  const usedColors = customers.map(c => c.color);
  const color = colors.find(c => !usedColors.includes(c)) || colors[customers.length % colors.length];
  const newId = customers.length > 0 ? Math.max(...customers.map(c=>c.id)) + 1 : 1;

  customers.push({ id: newId, name, color });
  if (selectedCustomerId === null) selectedCustomerId = newId;
  saveLocal();
  renderCustomerTabs();

  // GASへ同期
  const gasUrl = localStorage.getItem('bt_gantt_gas_url');
  if (gasUrl) {
    try { await callGAS({ action: 'addCustomer', name }); } catch(_) {}
  }

  closeModal('modal-add-customer');
  showToast('顧客を追加しました');
}

// ============================================================
// 工程追加
// ============================================================
function openAddTask() {
  // 顧客セレクト更新
  const sel = document.getElementById('task-customer');
  sel.innerHTML = customers.map(c =>
    `<option value="${c.id}" ${c.id === selectedCustomerId ? 'selected' : ''}>${escHtml(c.name)}</option>`
  ).join('');
  document.getElementById('modal-add-task').classList.remove('hidden');
}
async function addTask() {
  const customerId = parseInt(document.getElementById('task-customer').value);
  const name  = document.getElementById('task-name').value.trim();
  const start = document.getElementById('task-start').value;
  const end   = document.getElementById('task-end').value;
  const status= document.getElementById('task-status').value;
  const memo  = document.getElementById('task-memo').value.trim();
  if (!name || !start || !end) { showToast('工程名・開始日・終了日は必須です'); return; }

  const newId = tasks.length > 0 ? Math.max(...tasks.map(t=>t.id)) + 1 : 1;
  tasks.push({ id: newId, customer_id: customerId, item_name: name, start_date: start, end_date: end, status, memo });
  saveLocal();
  renderGantt();

  // GASへ同期
  const gasUrl = localStorage.getItem('bt_gantt_gas_url');
  if (gasUrl) {
    try { await callGAS({ action:'addTask', customer_id:customerId, item_name:name, start_date:start, end_date:end, status, memo }); } catch(_) {}
  }

  closeModal('modal-add-task');
  showToast('工程を追加しました');
}

// ============================================================
// 工程編集
// ============================================================
function openEditTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  document.getElementById('edit-task-id').value     = t.id;
  document.getElementById('edit-task-name').value   = t.item_name;
  document.getElementById('edit-task-start').value  = t.start_date;
  document.getElementById('edit-task-end').value    = t.end_date;
  document.getElementById('edit-task-status').value = t.status;
  document.getElementById('edit-task-memo').value   = t.memo;
  document.getElementById('modal-edit-task').classList.remove('hidden');
}
async function saveEditTask() {
  const id     = parseInt(document.getElementById('edit-task-id').value);
  const name   = document.getElementById('edit-task-name').value.trim();
  const start  = document.getElementById('edit-task-start').value;
  const end    = document.getElementById('edit-task-end').value;
  const status = document.getElementById('edit-task-status').value;
  const memo   = document.getElementById('edit-task-memo').value.trim();

  const idx = tasks.findIndex(t => t.id === id);
  if (idx >= 0) {
    tasks[idx] = { ...tasks[idx], item_name: name, start_date: start, end_date: end, status, memo };
    saveLocal();
    renderGantt();
  }

  const gasUrl = localStorage.getItem('bt_gantt_gas_url');
  if (gasUrl) {
    try { await callGAS({ action:'updateTask', id, item_name:name, start_date:start, end_date:end, status, memo }); } catch(_) {}
  }

  closeModal('modal-edit-task');
  showToast('保存しました');
}
async function deleteTaskById(id) {
  if (!confirm('この工程を削除しますか？')) return;
  id = parseInt(id);
  tasks = tasks.filter(t => t.id !== id);
  saveLocal();
  renderGantt();

  const gasUrl = localStorage.getItem('bt_gantt_gas_url');
  if (gasUrl) {
    try { await callGAS({ action:'deleteTask', id }); } catch(_) {}
  }

  closeModal('modal-edit-task');
  showToast('削除しました');
}

// ============================================================
// ガントチャート描画
// ============================================================
function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0) ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function dateStr(d) { return d.toISOString().slice(0,10); }

function shiftWeeks(n) { viewStartDate = addDays(viewStartDate, n*7); renderGantt(); }
function goToday()     { viewStartDate = getMonday(new Date()); renderGantt(); }

function renderGantt() {
  const area = document.getElementById('gantt-area');
  const customerTasks = tasks.filter(t => t.customer_id === selectedCustomerId);
  const customer = customers.find(c => c.id === selectedCustomerId);

  if (!customer) {
    area.innerHTML = '<div class="text-sm text-gray-400 text-center py-12">顧客を選択してください</div>';
    return;
  }

  // 日付配列（VIEW_DAYS日分）
  const dates = [];
  for (let i = 0; i < VIEW_DAYS; i++) dates.push(addDays(viewStartDate, i));
  const todayStr = new Date().toISOString().slice(0,10);

  // 月ヘッダー行（月が変わるときにセル結合）
  let monthCells = '';
  let mStart = 0;
  for (let i = 0; i <= dates.length; i++) {
    const prev = i > 0 ? dates[i-1].getMonth() : -1;
    const curr = i < dates.length ? dates[i].getMonth() : -1;
    if (i === dates.length || (i > 0 && curr !== prev)) {
      const span  = i - mStart;
      const label = `${dates[mStart].getMonth()+1}月`;
      monthCells += `<th class="day-col" colspan="${span}" style="background:#f3f4f6;font-size:11px;text-align:center">${label}</th>`;
      mStart = i;
    }
  }

  // 日付ヘッダー行
  let dayHeads = dates.map(d => {
    const s   = dateStr(d);
    const dow = ['日','月','火','水','木','金','土'][d.getDay()];
    const isToday = s === todayStr;
    const isSun = d.getDay() === 0;
    const isSat = d.getDay() === 6;
    const cls = isToday ? 'today-col font-bold text-blue-700'
              : isSun   ? 'text-red-400'
              : isSat   ? 'text-blue-400'
              : 'text-gray-500';
    return `<th class="day-col ${cls}">${d.getDate()}<br><span style="font-size:9px">${dow}</span></th>`;
  }).join('');

  // タスク行
  let taskRows = '';
  if (customerTasks.length === 0) {
    taskRows = `<tr><td class="gantt-label text-xs text-gray-400 py-4 text-center" colspan="${VIEW_DAYS+1}">工程がありません。「工程追加」ボタンで追加してください。</td></tr>`;
  } else {
    taskRows = customerTasks.map(t => {
      const labelCls = t.status === 'done' ? 'line-through text-gray-400' : 'text-gray-700';
      const statusBadge = t.status === 'done'
        ? '<span class="ml-1 text-xs bg-gray-100 text-gray-400 rounded px-1">完了</span>'
        : t.status === 'in_progress'
        ? '<span class="ml-1 text-xs bg-blue-100 text-blue-600 rounded px-1">進行中</span>'
        : '';

      const cells = dates.map(d => {
        const s = dateStr(d);
        const inRange = s >= t.start_date && s <= t.end_date;
        const isStart = s === t.start_date;
        const isEnd   = s === t.end_date;
        const isToday = s === todayStr;
        const bgClass = isToday ? 'today-col' : '';

        if (!inRange) return `<td class="day-col ${bgClass}"></td>`;

        const barClass = t.status === 'done' ? 'bar bar-done'
                       : t.status === 'in_progress' ? 'bar bar-in_progress'
                       : 'bar bar-pending';
        const radius = isStart && isEnd ? 'border-radius:3px'
                     : isStart ? 'border-radius:3px 0 0 3px'
                     : isEnd   ? 'border-radius:0 3px 3px 0'
                     : 'border-radius:0';
        return `<td class="day-col ${bgClass}" style="padding:2px 0">
          <div class="${barClass}" style="${radius};background:${t.status!=='done'&&t.status!=='pending'?customer.color:''};margin:1px 0"></div>
        </td>`;
      }).join('');

      return `<tr class="hover:bg-blue-50 transition cursor-pointer" onclick="openEditTask(${t.id})">
        <td class="gantt-label text-xs py-1.5 px-2">
          <div class="${labelCls} truncate" style="max-width:160px">${escHtml(t.item_name)}${statusBadge}</div>
          <div class="text-gray-400" style="font-size:10px">${t.start_date} 〜 ${t.end_date}</div>
          ${t.memo ? `<div class="text-gray-300 truncate" style="font-size:10px;max-width:140px">${escHtml(t.memo)}</div>` : ''}
        </td>
        ${cells}
      </tr>`;
    }).join('');
  }

  area.innerHTML = `
    <div style="padding:8px 12px 4px;border-bottom:1px solid #e5e7eb">
      <span class="text-xs font-bold" style="color:${customer.color}">${escHtml(customer.name)}</span>
      <span class="text-xs text-gray-400 ml-2">${customerTasks.length}工程</span>
      <span class="text-xs text-gray-400 ml-2">${dateStr(viewStartDate)} 〜 ${dateStr(addDays(viewStartDate, VIEW_DAYS-1))}</span>
    </div>
    <div class="gantt-wrap">
      <table class="gantt-table">
        <thead>
          <tr>
            <th class="gantt-label-header">工程名</th>
            ${monthCells}
          </tr>
          <tr>
            <th class="gantt-label-header" style="font-size:10px;color:#9ca3af">クリックで編集</th>
            ${dayHeads}
          </tr>
        </thead>
        <tbody>
          ${taskRows}
        </tbody>
      </table>
    </div>`;
}

// ============================================================
// ユーティリティ
// ============================================================
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2200);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// モーダル外クリックで閉じる
document.querySelectorAll('[id^="modal-"]').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.add('hidden'); });
});
</script>
