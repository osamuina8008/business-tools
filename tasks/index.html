<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>タスク管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .task-done { opacity: 0.4; }
    .task-done .task-title { text-decoration: line-through; }
    #add-modal { display: none; }
    #add-modal.open { display: flex; }
    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* iOS safe area */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 16px); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="../index.html" class="text-gray-400 hover:text-gray-600 text-sm hidden sm:inline">← 一覧</a>
        <h1 class="text-base font-bold text-gray-800">タスク管理</h1>
        <span id="badge-high" class="hidden text-xs bg-red-500 text-white px-2 py-0.5 rounded-full font-bold"></span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="syncCalendar()" id="sync-btn"
          class="flex items-center gap-1 text-xs text-blue-600 border border-blue-200 bg-blue-50 px-3 py-1.5 rounded-xl hover:bg-blue-100 transition">
          <svg id="sync-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          GCal同期
        </button>
        <button onclick="openSettings()"
          class="text-gray-400 hover:text-gray-600 p-1.5 rounded-lg hover:bg-gray-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- フィルターバー -->
  <div class="bg-white border-b border-gray-100 sticky top-[53px] z-10">
    <div class="max-w-2xl mx-auto px-4 py-2 flex items-center gap-2 overflow-x-auto scrollbar-hide">
      <button onclick="setFilter('active')" data-f="active"
        class="f-btn whitespace-nowrap text-xs font-bold px-3 py-1.5 rounded-full bg-gray-900 text-white flex-shrink-0">未完了</button>
      <button onclick="setFilter('all')" data-f="all"
        class="f-btn whitespace-nowrap text-xs font-bold px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 flex-shrink-0">すべて</button>
      <button onclick="setFilter('done')" data-f="done"
        class="f-btn whitespace-nowrap text-xs font-bold px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 flex-shrink-0">完了済み</button>
      <div class="w-px h-5 bg-gray-200 flex-shrink-0"></div>
      <button onclick="setPri('all')" data-p="all"
        class="p-btn whitespace-nowrap text-xs px-3 py-1.5 rounded-full bg-gray-900 text-white font-bold flex-shrink-0">全て</button>
      <button onclick="setPri('high')" data-p="high"
        class="p-btn whitespace-nowrap text-xs px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 flex-shrink-0">🔴 急ぎ</button>
      <button onclick="setPri('mid')" data-p="mid"
        class="p-btn whitespace-nowrap text-xs px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 flex-shrink-0">🟡 今週</button>
      <button onclick="setPri('low')" data-p="low"
        class="p-btn whitespace-nowrap text-xs px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 flex-shrink-0">🟢 今月</button>
    </div>
  </div>

  <!-- タスクリスト -->
  <main class="max-w-2xl mx-auto px-4 py-4">
    <!-- カレンダー同期セクション -->
    <div id="cal-section" class="hidden mb-4">
      <div class="flex items-center gap-2 mb-2">
        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span class="text-xs font-bold text-blue-600">Googleカレンダー（予定）</span>
      </div>
      <div id="cal-tasks" class="space-y-1.5"></div>
    </div>

    <!-- ローカルタスク -->
    <div id="task-list" class="space-y-1.5"></div>
  </main>

  <!-- FAB（追加ボタン） -->
  <button onclick="openAddModal()"
    class="fixed bottom-6 right-4 w-14 h-14 bg-yellow-500 hover:bg-yellow-600 text-white rounded-full shadow-lg flex items-center justify-center transition z-30 safe-bottom"
    style="bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px))">
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
  </button>

  <!-- 追加モーダル -->
  <div id="add-modal" class="fixed inset-0 z-40 items-end justify-center bg-black/40 backdrop-blur-sm">
    <div class="w-full max-w-2xl bg-white rounded-t-3xl px-5 pt-5 pb-8 safe-bottom">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-gray-800">タスクを追加</h2>
        <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="space-y-3">
        <input id="t-title" type="text" placeholder="タスク名 *" autocomplete="off"
          class="w-full border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400 text-base" />

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-gray-500 block mb-1">優先度</label>
            <select id="t-priority" class="w-full border border-gray-200 rounded-2xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
              <option value="high">🔴 高（急ぎ）</option>
              <option value="mid" selected>🟡 中（今週）</option>
              <option value="low">🟢 低（今月）</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500 block mb-1">カテゴリ</label>
            <select id="t-category" class="w-full border border-gray-200 rounded-2xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
              <option value="sales">営業</option>
              <option value="quote">見積・受注</option>
              <option value="visit">訪問準備</option>
              <option value="admin">事務処理</option>
              <option value="other">その他</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-500 block mb-1">期限</label>
          <input id="t-due" type="date"
            class="w-full border border-gray-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
        </div>

        <input id="t-memo" type="text" placeholder="メモ（省略可）"
          class="w-full border border-gray-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />

        <button onclick="addTask()"
          class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3.5 rounded-2xl transition text-base">
          追加する
        </button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">
    <div class="w-full max-w-md bg-white rounded-3xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-gray-800">設定</h2>
        <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-sm font-bold text-gray-700 block mb-1">Google Apps Script URL</label>
          <p class="text-xs text-gray-500 mb-2">カレンダーの終日イベントを取り込みます。gas/calendar-sync.gs を script.google.com に貼り付けてデプロイし、URLを入力してください。</p>
          <input id="gas-url" type="url" placeholder="https://script.google.com/macros/s/..."
            class="w-full border border-gray-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <button onclick="saveSettings()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl transition">
          保存して同期テスト
        </button>
        <div id="gas-test-result" class="text-xs text-center text-gray-500"></div>

        <hr class="border-gray-100" />

        <div>
          <label class="text-sm font-bold text-gray-700 block mb-1">プッシュ通知</label>
          <p class="text-xs text-gray-500 mb-2">今日・明日の予定をOS通知でお知らせします。</p>
          <button onclick="requestNotifPermission()" id="notif-btn"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-2xl transition text-sm">
            通知を許可する
          </button>
          <div id="notif-status" class="text-xs text-center text-gray-400 mt-1"></div>
        </div>

        <hr class="border-gray-100" />

        <button onclick="clearDone()"
          class="w-full text-sm text-red-500 hover:text-red-700 py-2 transition">
          完了済みタスクを全削除
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-sm px-4 py-2.5 rounded-xl opacity-0 transition-opacity pointer-events-none z-50 whitespace-nowrap">
    <span id="toast-msg"></span>
  </div>

<script>
const PRI = {
  high: { icon:'🔴', label:'急ぎ', bg:'bg-red-50',    ring:'ring-red-300',    order:0 },
  mid:  { icon:'🟡', label:'今週', bg:'bg-yellow-50', ring:'ring-yellow-300', order:1 },
  low:  { icon:'🟢', label:'今月', bg:'bg-green-50',  ring:'ring-green-300',  order:2 },
};
const CAT = { sales:'営業', quote:'見積・受注', visit:'訪問準備', admin:'事務処理', other:'その他' };

let filterStatus  = 'active';
let filterPri     = 'all';
let calItems      = [];
let calDismissed  = new Set(JSON.parse(localStorage.getItem('bt_cal_dismissed') || '[]'));

// ---- Storage ----
function load()  { return JSON.parse(localStorage.getItem('bt_tasks2') || '[]'); }
function save(t) { localStorage.setItem('bt_tasks2', JSON.stringify(t)); }

// ---- Add ----
function addTask() {
  const title = document.getElementById('t-title').value.trim();
  if (!title) { showToast('タスク名を入力してください'); return; }
  const tasks = load();
  tasks.push({
    id:       Date.now(),
    title,
    priority: document.getElementById('t-priority').value,
    category: document.getElementById('t-category').value,
    due:      document.getElementById('t-due').value,
    memo:     document.getElementById('t-memo').value.trim(),
    done:     false,
    created:  Date.now(),
    source:   'manual',
  });
  save(tasks);
  render();
  closeAddModal();
  showToast('追加しました');
}

// ---- Toggle / Delete ----
function toggleDone(id) {
  save(load().map(t => t.id === id ? {...t, done: !t.done} : t));
  render();
}
function deleteTask(id) {
  save(load().filter(t => t.id !== id));
  render();
  showToast('削除しました');
}
function clearDone() {
  save(load().filter(t => !t.done));
  render();
  closeSettings();
  showToast('完了済みを削除しました');
}

// ---- GCal Sync ----
async function syncCalendar() {
  const url = localStorage.getItem('bt_gas_url');
  if (!url) { openSettings(); showToast('先にGAS URLを設定してください'); return; }

  const icon = document.getElementById('sync-icon');
  icon.classList.add('spinner');

  try {
    const res  = await fetch(url);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    calItems = data.items || [];
    renderCalTasks();
    showToast(`${calItems.length}件を同期しました`);
    // SW にURLを送り、通知もトリガー
    const gasUrl2 = localStorage.getItem('bt_gas_url');
    if (gasUrl2) sendUrlToSW(gasUrl2);
    notifyTodayEvents();
  } catch (e) {
    showToast('同期に失敗しました');
    console.error(e);
  }
  icon.classList.remove('spinner');
}

function dismissCalItem(id) {
  calDismissed.add(id);
  localStorage.setItem('bt_cal_dismissed', JSON.stringify([...calDismissed]));
  renderCalTasks();
  showToast('完了しました');
}

function renderCalTasks() {
  const el  = document.getElementById('cal-tasks');
  const sec = document.getElementById('cal-section');
  const today = new Date().toISOString().slice(0,10);
  const items = calItems.filter(i => i.date >= today && !calDismissed.has(i.id));

  if (!items.length) { sec.classList.add('hidden'); return; }
  sec.classList.remove('hidden');

  el.innerHTML = items.map(item => {
    const diff = Math.round((new Date(item.date) - new Date(today)) / 86400000);
    const dueLbl = diff === 0 ? '今日' : diff === 1 ? '明日' : `${item.date.slice(5).replace('-','/')}`;
    const timeStr = item.time ? `<span class="text-xs text-blue-500 font-semibold">${escHtml(item.time)}</span>` : '';
    return `
    <div class="flex items-center gap-3 bg-blue-50 border border-blue-100 rounded-2xl px-4 py-3">
      <button onclick="dismissCalItem(${JSON.stringify(item.id)})"
        class="flex-shrink-0 w-6 h-6 rounded-full border-2 border-blue-300 hover:border-blue-500 hover:bg-blue-200 flex items-center justify-center transition">
      </button>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-800 truncate">${escHtml(item.title)}</p>
        <div class="flex items-center gap-1.5 mt-0.5">
          ${timeStr}
          ${item.description ? `<p class="text-xs text-gray-500 truncate">${escHtml(item.description)}</p>` : ''}
        </div>
      </div>
      <span class="text-xs font-bold text-blue-600 flex-shrink-0">${dueLbl}</span>
    </div>`;
  }).join('');
}

// ---- Render ----
function render() {
  let tasks = load();
  if (filterStatus === 'active') tasks = tasks.filter(t => !t.done);
  if (filterStatus === 'done')   tasks = tasks.filter(t =>  t.done);
  if (filterPri    !== 'all')    tasks = tasks.filter(t => t.priority === filterPri);

  // 優先度→期限順でソート
  const today = new Date().toISOString().slice(0,10);
  tasks.sort((a, b) => {
    const pd = PRI[a.priority].order - PRI[b.priority].order;
    if (pd !== 0) return pd;
    if (a.due && b.due) return a.due.localeCompare(b.due);
    if (a.due) return -1; if (b.due) return 1;
    return b.created - a.created;
  });

  // バッジ
  const all    = load();
  const high   = all.filter(t => !t.done && t.priority === 'high').length;
  const badge  = document.getElementById('badge-high');
  if (high > 0) { badge.textContent = `急ぎ ${high}`; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');

  const el = document.getElementById('task-list');
  if (!tasks.length) {
    el.innerHTML = `<div class="text-center py-16 text-gray-400">
      <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
      <p class="text-sm font-semibold">タスクはありません</p>
      <p class="text-xs mt-1">右下の＋ボタンで追加</p>
    </div>`;
    return;
  }

  el.innerHTML = tasks.map(t => {
    const p    = PRI[t.priority];
    const diff = t.due ? Math.round((new Date(t.due) - new Date(today)) / 86400000) : null;
    let dueLbl = '';
    if (diff !== null) {
      if (diff < 0)   dueLbl = `<span class="text-xs text-red-500 font-bold">⚠ ${Math.abs(diff)}日超過</span>`;
      else if (!diff) dueLbl = `<span class="text-xs text-red-500 font-bold">今日まで</span>`;
      else if (diff===1) dueLbl = `<span class="text-xs text-orange-500 font-semibold">明日まで</span>`;
      else if (diff<=3) dueLbl = `<span class="text-xs text-orange-400">${diff}日後</span>`;
      else dueLbl = `<span class="text-xs text-gray-400">${t.due.slice(5).replace('-','/')}</span>`;
    }

    return `
    <div class="fade-in ${t.done ? 'task-done' : ''} flex items-center gap-3 bg-white rounded-2xl px-4 py-3.5 border border-gray-100 shadow-sm">
      <button onclick="toggleDone(${t.id})"
        class="flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition
          ${t.done ? 'bg-gray-400 border-gray-400' : `border-gray-300 hover:border-yellow-400 ring-2 ring-offset-1 ${p.ring}`}">
        ${t.done ? '<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
      </button>
      <div class="flex-1 min-w-0">
        <p class="task-title text-sm font-semibold text-gray-800 leading-snug">${escHtml(t.title)}</p>
        <div class="flex items-center gap-1.5 mt-1 flex-wrap">
          <span class="text-xs font-bold">${p.icon}</span>
          <span class="text-xs text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded-full">${CAT[t.category]||'その他'}</span>
          ${dueLbl}
          ${t.memo ? `<span class="text-xs text-gray-400 truncate max-w-24">${escHtml(t.memo)}</span>` : ''}
        </div>
      </div>
      <button onclick="deleteTask(${t.id})" class="flex-shrink-0 text-gray-300 hover:text-red-400 transition p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>
    </div>`;
  }).join('');
}

// ---- Filters ----
function setFilter(f) {
  filterStatus = f;
  document.querySelectorAll('.f-btn').forEach(b => {
    const a = b.dataset.f === f;
    b.className = `f-btn whitespace-nowrap text-xs font-bold px-3 py-1.5 rounded-full flex-shrink-0 transition ${a ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-600'}`;
  });
  render();
}
function setPri(p) {
  filterPri = p;
  document.querySelectorAll('.p-btn').forEach(b => {
    const a = b.dataset.p === p;
    b.className = `p-btn whitespace-nowrap text-xs px-3 py-1.5 rounded-full flex-shrink-0 transition font-bold ${a ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-600'}`;
  });
  render();
}

// ---- Modal ----
function openAddModal() {
  document.getElementById('add-modal').classList.add('open');
  document.getElementById('t-due').value = new Date().toISOString().slice(0,10);
  setTimeout(() => document.getElementById('t-title').focus(), 100);
}
function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
  ['t-title','t-memo'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('t-due').value = '';
}
function openSettings() {
  document.getElementById('gas-url').value = localStorage.getItem('bt_gas_url') || '';
  document.getElementById('settings-modal').classList.remove('hidden');
}
function closeSettings() {
  document.getElementById('settings-modal').classList.add('hidden');
  document.getElementById('gas-test-result').textContent = '';
}
async function saveSettings() {
  const url = document.getElementById('gas-url').value.trim();
  localStorage.setItem('bt_gas_url', url);
  const el = document.getElementById('gas-test-result');
  el.textContent = '接続テスト中...';
  try {
    const res  = await fetch(url);
    const data = await res.json();
    if (data.status === 'ok') {
      el.textContent = `✅ 接続成功 — ${data.count}件のイベントを取得`;
      el.className = 'text-xs text-center text-green-600';
      calItems = data.items || [];
      renderCalTasks();
    } else throw new Error(data.message);
  } catch (e) {
    el.textContent = `❌ 接続失敗: ${e.message}`;
    el.className = 'text-xs text-center text-red-500';
  }
}

// ---- Util ----
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2000);
}

// モーダル背景クリックで閉じる
document.getElementById('add-modal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});
document.getElementById('settings-modal').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

render();

// ---- Service Worker & 通知 ----
let swReg = null;

async function initSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register('./sw.js');
    // GAS URLをSWに送信
    const url = localStorage.getItem('bt_gas_url');
    if (url) sendUrlToSW(url);
    // Periodic Background Sync 登録
    if (swReg.periodicSync) {
      const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
      if (status.state === 'granted') {
        await swReg.periodicSync.register('cal-check', { minInterval: 8 * 60 * 60 * 1000 }); // 8時間
      }
    }
  } catch (e) { console.warn('SW registration failed:', e); }
}

function sendUrlToSW(url) {
  if (!swReg?.active) return;
  swReg.active.postMessage({ type: 'SET_GAS_URL', url });
}

async function requestNotifPermission() {
  if (!('Notification' in window)) {
    document.getElementById('notif-status').textContent = 'このブラウザは通知非対応です';
    return;
  }
  const result = await Notification.requestPermission();
  updateNotifUI(result);
  if (result === 'granted') {
    showToast('通知が有効になりました');
    // 今日の予定をすぐ通知
    notifyTodayEvents();
  }
}

function updateNotifUI(permission) {
  const btn = document.getElementById('notif-btn');
  const st  = document.getElementById('notif-status');
  if (!btn) return;
  if (permission === 'granted') {
    btn.textContent = '✅ 通知ON';
    btn.className = btn.className.replace('bg-green-600 hover:bg-green-700', 'bg-gray-300 cursor-default');
    st.textContent = '今日・明日の予定をお知らせします';
  } else if (permission === 'denied') {
    btn.textContent = '🚫 通知がブロックされています';
    btn.className = btn.className.replace('bg-green-600 hover:bg-green-700', 'bg-red-100 text-red-600 cursor-default');
    st.textContent = 'ブラウザの設定から許可してください';
  }
}

function notifyTodayEvents() {
  if (Notification.permission !== 'granted' || !calItems.length) return;
  const today    = new Date().toISOString().slice(0, 10);
  const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  const todayItems    = calItems.filter(i => i.date === today    && !calDismissed.has(i.id));
  const tomorrowItems = calItems.filter(i => i.date === tomorrow && !calDismissed.has(i.id));

  if (todayItems.length > 0) {
    new Notification('📅 今日の予定', {
      body: todayItems.map(i => (i.time ? i.time + ' ' : '') + i.title).join('\n'),
      tag:  'cal-today',
    });
  }
  if (tomorrowItems.length > 0) {
    new Notification('📅 明日の予定', {
      body: tomorrowItems.map(i => (i.time ? i.time + ' ' : '') + i.title).join('\n'),
      tag:  'cal-tomorrow',
    });
  }
}

// 初期化
initSW();
if ('Notification' in window) updateNotifUI(Notification.permission);
</script>
