// ===== RSS取得 =====
async function fetchRSS(source) {
  const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.rss)}`;
  try {
    const res = await fetch(apiUrl, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    if (data.status !== 'ok') throw new Error('rss error');
    return data.items.map(item => ({
      sourceId: source.id,
      sourceName: source.name,
      sourceColor: source.color,
      title: item.title || '',
      link: item.link || '',
      pubDate: item.pubDate ? new Date(item.pubDate) : new Date(),
      description: (item.description || '').replace(/<[^>]*>/g, '').substring(0, 120),
    }));
  } catch (e) {
    console.warn(`Failed: ${source.name}`, e);
    return [];
  }
}

// ===== キーワードハイライト =====
function highlightKeywords(text) {
  let result = escapeHtml(text);
  METAL_KEYWORDS.forEach(kw => {
    result = result.replace(new RegExp(kw, 'g'), `<mark>${kw}</mark>`);
  });
  return result;
}
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== 日付ユーティリティ =====
function isToday(d) {
  if (!d || isNaN(d)) return false;
  const now = new Date();
  return d.getFullYear() === now.getFullYear() &&
         d.getMonth()    === now.getMonth()    &&
         d.getDate()     === now.getDate();
}
function isLast3Days(d) {
  // 昨日・一昨日（本日は除く）
  if (!d || isNaN(d)) return false;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 2);
  cutoff.setHours(0, 0, 0, 0);
  return d >= cutoff && !isToday(d);
}
function isWithinMonth(d) {
  if (!d || isNaN(d)) return false;
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 1);
  return d >= cutoff;
}
function formatDate(d) {
  if (!d || isNaN(d)) return '';
  const now = new Date();
  const diff = Math.floor((now - d) / 60000);
  if (diff < 60)   return `${diff}分前`;
  if (diff < 1440) return `${Math.floor(diff/60)}時間前`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ===== 1枚のカード生成 =====
function buildCard(item) {

  card.href = item.link;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';
  card.className = 'bg-white rounded-2xl border border-gray-200 p-4 flex flex-col gap-2 card-hover fade-in no-underline';
  card.innerHTML = `
    <div class="flex items-center justify-between">
      <span class="source-tag ${item.sourceColor}">${item.sourceName}</span>
      <span class="text-xs text-gray-400">${formatDate(item.pubDate)}</span>
    </div>
    <p class="text-sm font-semibold text-gray-800 leading-snug line-clamp-3">${highlightKeywords(item.title)}</p>
    <p class="text-xs text-gray-500 leading-relaxed line-clamp-2">${highlightKeywords(item.description)}</p>
    <div class="mt-auto pt-1 text-xs text-blue-500 font-medium">続きを読む →</div>
  `;
  return card;
}

// ===== セクションヘッダー生成 =====
function buildSectionHeader(label, count, color) {
  const div = document.createElement('div');
  div.className = 'col-span-3 flex items-center gap-3 mt-2 mb-1';
  div.innerHTML = `
    <span class="text-sm font-bold ${color}">${label}</span>
    <span class="text-xs text-gray-400">${count}件</span>
    <div class="flex-1 border-t border-gray-200"></div>
  `;
  return div;
}

// ===== カード描画（今日 / 過去を分離） =====
function renderCards(items, allPeriod = false) {
  const grid = document.getElementById('news-grid');
  grid.innerHTML = '';

  if (items.length === 0) {
    grid.innerHTML = `<div class="col-span-3 text-center py-12 text-gray-400 text-sm">
      該当するニュースが見つかりませんでした。
    </div>`;
    return;
  }

  const todayItems  = items.filter(i => isToday(i.pubDate));
  const days3Items  = items.filter(i => isLast3Days(i.pubDate));
  const olderItems  = items.filter(i => !isToday(i.pubDate) && !isLast3Days(i.pubDate));

  if (todayItems.length > 0) {
    grid.appendChild(buildSectionHeader('🔴 本日', todayItems.length, 'text-red-600'));
    todayItems.forEach(item => grid.appendChild(buildCard(item)));
  }

  if (days3Items.length > 0) {
    grid.appendChild(buildSectionHeader('🟡 直近3日（昨日・一昨日）', days3Items.length, 'text-yellow-600'));
    days3Items.forEach(item => grid.appendChild(buildCard(item)));
  }

  if (olderItems.length > 0) {
    const olderLabel = allPeriod ? '📁 過去（全期間）' : '📁 直近1ヶ月';
    grid.appendChild(buildSectionHeader(olderLabel, olderItems.length, 'text-gray-500'));
    olderItems.forEach(item => grid.appendChild(buildCard(item)));
  }
}

// ===== フィルター =====
function filterSource(srcId) {
  currentSource = srcId;
  document.querySelectorAll('.src-btn').forEach(b => {
    const isActive = b.dataset.src === srcId;
    b.className = isActive
      ? 'src-btn active px-4 py-2 rounded-xl text-sm font-semibold bg-blue-600 text-white transition'
      : 'src-btn px-4 py-2 rounded-xl text-sm font-semibold bg-white border-2 border-gray-200 text-gray-600 hover:border-blue-400 hover:text-blue-600 transition';
  });
  applyKeywordFilter();
}

function applyKeywordFilter() {
  const kw = document.getElementById('keyword-filter').value.trim().toLowerCase();
  let items = currentSource === 'all' ? allItems : allItems.filter(i => i.sourceId === currentSource);

  if (kw) {
    // キーワードあり → 全期間・全件を対象に検索（1ヶ月制限解除）
    items = items.filter(i =>
      i.title.toLowerCase().includes(kw) || i.description.toLowerCase().includes(kw)
    );
    renderCards(items, true);
  } else {
    // キーワードなし → 直近1ヶ月のみ表示
    items = items.filter(i => isWithinMonth(i.pubDate));
    renderCards(items, false);
  }
}

async function refreshAll() {
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  btn.disabled = true;
  icon.classList.add('spinner');

  document.getElementById('news-grid').innerHTML = `
    <div id="loading-state" class="col-span-3 flex flex-col items-center justify-center py-16 text-gray-400">
      <svg class="spinner w-8 h-8 mb-3 text-blue-400" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
      <p class="text-sm">ニュースを取得中...</p>
    </div>`;

  const results = await Promise.all(SOURCES.map(s => fetchRSS(s)));
  allItems = results.flat().sort((a, b) => b.pubDate - a.pubDate);

  const now = new Date();
  document.getElementById('last-updated').textContent =
    `最終更新: ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

  applyKeywordFilter();
  btn.disabled = false;
  icon.classList.remove('spinner');
}

let currentRegionId = 'kinki';
let currentPrefFilter = null; // null = 地方全体

async function loadRegion(regionId, prefFilter) {
  currentRegionId = regionId;
  currentPrefFilter = prefFilter || null;
  const r = REGIONS[regionId];

  // ボタンアクティブ切替
  document.querySelectorAll('.region-btn').forEach(b => {
    const active = b.dataset.region === regionId;
    b.className = `region-btn text-sm font-bold px-4 py-2 rounded-xl transition ${
      active ? r.color.btn : 'bg-white border-2 border-gray-200 text-gray-600'}`;
  });

  // サブ都道府県ボタン描画
  const subEl = document.getElementById('pref-sub-btns');
  subEl.innerHTML = `
    <button onclick="loadRegion('${regionId}')" data-pref="all"
      class="pref-sub-btn text-xs font-bold px-3 py-1 rounded-full ${!prefFilter ? r.color.btn : 'bg-gray-100 text-gray-600'} transition">
      全域
    </button>
    ${r.prefs.map(p => `
      <button onclick="loadRegion('${regionId}','${p}')" data-pref="${p}"
        class="pref-sub-btn text-xs font-semibold px-3 py-1 rounded-full ${prefFilter===p ? r.color.btn : r.color.sub} transition">
        ${p}
      </button>`).join('')}`;

  // ラベル更新
  document.getElementById('region-label').textContent = prefFilter || r.label;

  // ニュース取得
  const el = document.getElementById('regional-result');
  el.innerHTML = `<div class="flex items-center gap-2 py-6 justify-center text-gray-400">
    <svg class="spinner w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
    </svg>
    <span class="text-sm">${prefFilter || r.label} のニュースを取得中...</span>
  </div>`;

  const searchQuery = prefFilter
    ? `製造業 OR 金属加工 OR 工場 OR 部品 ${prefFilter}`
    : `製造業 OR 金属加工 OR 工場 (${r.query})`;

  const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(searchQuery)}&hl=ja&gl=JP&ceid=JP:ja`;
  const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&count=10`;

  try {
    const res  = await fetch(apiUrl);
    const data = await res.json();
    if (data.status !== 'ok' || !data.items.length) throw new Error('no items');

    // ===== 重複除去 =====
    // Googleニュースは同じ記事が複数媒体で配信される
    // タイトルから「 - 媒体名」を除いた本体部分で重複チェック
    const seen = new Set();
    const unique = data.items.filter(item => {
      const base = (item.title || '').replace(/\s*[-–—]\s*[^-–—]+$/, '').trim().toLowerCase();
      if (seen.has(base)) return false;
      seen.add(base);
      return true;
    });

    el.innerHTML = `
      <p class="text-xs font-semibold text-gray-500 mb-3">${prefFilter || r.label} — 製造業・金属加工関連（${unique.length}件・重複除去済）</p>
      <div class="space-y-2">
        ${unique.map(item => {
          const d = item.pubDate ? new Date(item.pubDate) : null;
          const date = d ? `${d.getMonth()+1}/${d.getDate()}` : '';
          // 媒体名を抽出（タイトル末尾の「 - 媒体名」部分）
          const sourceMatch = (item.title||'').match(/[-–—]\s*([^-–—]+)$/);
          const sourceName = sourceMatch ? sourceMatch[1].trim() : (item.author || '');
          // 表示タイトルは媒体名を除いた部分
          const displayTitle = (item.title||'').replace(/\s*[-–—]\s*[^-–—]+$/, '').trim();
          return `
            <a href="${escapeHtml(item.link||'#')}" target="_blank" rel="noopener noreferrer"
              class="flex items-start gap-3 p-3 rounded-xl bg-gray-50 hover:bg-emerald-50 transition border-l-4 border-emerald-400 block fade-in">
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-gray-800 leading-snug line-clamp-2">${highlightKeywords(escapeHtml(displayTitle))}</p>
                <div class="flex items-center gap-2 mt-1">
                  ${sourceName ? `<span class="text-xs text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded">${escapeHtml(sourceName)}</span>` : ''}
                  <span class="text-xs text-gray-400">${date}</span>
                </div>
              </div>
              <svg class="w-4 h-4 text-gray-300 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </a>`;
        }).join('')}
      </div>`;
  } catch {
    el.innerHTML = `<p class="text-sm text-gray-400 text-center py-6">ニュースを取得できませんでした。しばらくして再度お試しください。</p>`;
  }
}
